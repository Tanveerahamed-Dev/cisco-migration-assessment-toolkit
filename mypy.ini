[mypy]
# Report-only mypy baseline for COLLECT_PARSE_V3_23_0.py - a lightly-typed
# single-file script. NOT gated: mypy currently reports a baseline of dynamic-
# typing findings (union narrowing, dict[str, object] access, untyped openpyxl)
# that were inspected and are strictness, not bugs. Run: python -m mypy COLLECT_PARSE_V3_23_0.py
# Tracked for incremental future typing; see CHAT_SUMMARY.md (V3.23.10).
# 3.10 is deliberate and must stay: pyproject declares `requires-python = ">=3.10"` and CI's
# matrix tests 3.10-3.14, so the type check has to hold at the LOWEST supported version.
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True

# numpy >= 2.3 writes its stubs with PEP 695 `type` statements, which are 3.12+ syntax. Parsed
# under `python_version = 3.10` that is a SYNTAX error, and mypy stops the run at the first one:
#   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12 and greater
#   Found 1 error in 1 file (errors prevented further checking)
# "errors prevented further checking" means the full-project report checked NO project code at
# all while still producing output and, in CI, a `continue-on-error` step that reads as done. A
# report that reports nothing is the quietest way to lose a gate. (The gated 8-module run was
# unaffected only because none of those modules reach numpy -- so the failure was invisible from
# the side that gates.)
#
# Skip FOLLOWING numpy's stubs rather than lowering the target: numpy-derived values become Any,
# which is the right trade for a report-only baseline, and 3.10 checking of our own code is kept.
[mypy-numpy]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
