# Packaging for the Cisco Migration-Assessment Toolkit.
#
# Scope: this makes the project installable (`pip install .` for a relocatable wheel, or `pip install -e .`
# / `pip install -e .[dev,docx]` for development) and exposes a stable `cisco-assess` console command that
# runs the same entry point as `python COLLECT_PARSE_V3_23_0.py`. Both runtime data sources live INSIDE the
# package and resolve relative to it — the gzipped KB files (`cisco_toolkit/data/`) and the single-file
# explorer template (`cisco_toolkit/blast_radius_explorer.html`) — so they ship in a wheel and load the
# same whether the package runs from a checkout or a pip install. Both are declared as package-data below.
#
# Tooling config (ruff / pytest / mypy) deliberately stays in ruff.toml / pytest.ini / mypy.ini rather
# than migrating into [tool.*] here, to avoid any change in how those tools resolve their settings.

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-migration-assessment-toolkit"
# RELEASE version — tracks the change log and git tags (the V3.x release train). This is intentionally DECOUPLED from
# `cisco_toolkit.__version__` ("3.23.0"): that constant is the snapshot-SCHEMA version baked into the
# golden data contract (`script_version` in every snapshot), and bumping it would churn the frozen
# golden. See the change log ("In-code version 3.23.0") and tests/test_pipeline_golden.py.
version = "3.32.1"
description = "Evidence-led Cisco L1-L4 network migration-assessment toolkit: one offline SSH collection produces a multi-sheet Excel workbook, an interactive single-file topology explorer, and a DOCX runbook."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Tanveerahamed-Dev" }]
keywords = ["cisco", "network", "migration", "assessment", "ios", "ios-xe", "nxos", "netmiko", "topology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "tomli>=2,<3; python_version < '3.11'",
    "netmiko>=4.1,<5",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# Compatibility aliases retained for existing install commands. DOCX/PPTX and the web runtime are
# base dependencies because their entry points and deliverables are enabled by default.
docx = ["python-docx>=1.1,<2"]
pptx = ["python-pptx>=0.6,<2"]
# Test / lint / type tooling (report-only mypy baseline; ruff gates correctness rules).
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    # REQUIRED by the Stop hook's green gate, not an optional speed-up. The suite runs 486-611 s
    # serially depending on machine load, and `.claude/hooks/verify-green.sh` bounds its run at
    # 540 s — INSIDE that variance band, so the gate blocked turns on a suite that passes, at
    # random. Raising the bound is not available: the hook ceiling is 600 s. Under
    # `-n auto --dist loadfile` the same 5,015 tests (verified id-for-id against a serial run,
    # zero either-side-only) complete in ~166 s, which puts the gate back outside the band.
    # `--dist loadfile` rather than the default `load`: several modules own expensive module-scoped
    # fixtures (test_phase_timings_contract's real `--redact` pipeline run is ~14 s), and splitting
    # a module across workers would re-run its fixture once per worker.
    "pytest-xdist>=3,<4",
    "ruff>=0.5",
    "mypy>=1.8",
    "ntc-templates>=4,<10",
    # REQUIRED for webapp/tests to be COLLECTED AT ALL. `webapp/tests/conftest.py` needs
    # ("fastapi", "httpx") and sets collect_ignore_glob when either is missing; pytest then exits 5
    # having run nothing. httpx is NOT a base fastapi dependency — it ships only under fastapi's
    # `standard`/`all` extras, and this project depends on bare `fastapi>=0.110,<1`. Since
    # webapp-ci.yml installs `-e ".[dev]"`, its entire suite (Atlas redaction, security hardening,
    # DNS-rebinding, unplug-safety) was collected in ZERO jobs, and ci.yml's matrix silently skipped
    # webapp/tests for the same reason. Declared here rather than only in webapp/requirements.txt
    # because `[dev]` is what CI actually installs.
    "httpx>=0.23,<1",
]
# The Model Context Protocol server is optional: it exposes READ-ONLY query tools over a
# already-produced snapshot.json (offline, no egress). The base engine never imports `mcp`
# unless this extra is installed; cisco_toolkit.mcp_server guards the import at call time.
mcp = ["mcp>=1.28,<3"]
# The AssessHub web layer (webapp/backend) + the `assesshub` entry point (ADR-0004 P1: the
# portable app's one door). Mirrors webapp/requirements.txt — keep the two in lockstep.
# Compatibility alias; AssessHub runtime dependencies are already in the base set.
webapp = []
# Building the Atlas one-folder portable bundle (ADR-0004 P2; portable/build_atlas.py).
build = ["pyinstaller>=6.10,<7"]
# The D10 Phase-2 retrieval-eval stack (P2-0b; docs/d10-retrieval-eval-design-2026-07-08.md §8) —
# all offline/air-gap-safe, none imported by the engine: rank-bm25 (the auditable pure-Python Okapi
# BM25 — §4's frozen priors k1/b are constructor args), pytrec-eval-terrier (the maintained
# reference trec_eval binding that ships Windows wheels), scipy (the pre-registered paired t-test).
# Dense-lane deps (sentence-transformers, faiss-cpu) are deliberately ABSENT until the §5 traffic
# bar clears (≥30% semantic of 30 REAL logged queries) — the zero-embedding preference holds until
# measured otherwise. API surface pinned by tests/test_eval_deps.py (skips when not installed).
eval = ["rank-bm25>=0.2,<1", "pytrec-eval-terrier>=0.5,<1", "scipy>=1.10,<2"]

[project.scripts]
# Stable command -> the existing main() in the (versioned-filename) entry module. No refactor required:
# `main()` is a plain function and the module's __main__ guard already just calls it.
cisco-assess = "COLLECT_PARSE_V3_23_0:main"
# Optional MCP server over a produced snapshot.json (needs the [mcp] extra). Read-only, offline.
cisco-mcp-server = "cisco_toolkit.mcp_server:main"
# Atlas / AssessHub production entry (ADR-0004 P1): uvicorn.run(app) with no reload/workers,
# --selftest for silent-degrade assets, and the frozen engine-child sentinel.
assesshub = "webapp.backend.serve:main"

[project.urls]
Homepage = "https://github.com/Tanveerahamed-Dev/cisco-migration-assessment-toolkit"
Repository = "https://github.com/Tanveerahamed-Dev/cisco-migration-assessment-toolkit"
Changelog = "https://github.com/Tanveerahamed-Dev/cisco-migration-assessment-toolkit/blob/main/COLLECT_PARSE_V3_23_0.md"

# Explicit layout (the project uses a flat repo root, not a src/ layout): ship the cisco_toolkit package
# plus the top-level entry module. Explicit config disables setuptools auto-discovery, which would
# otherwise be ambiguous given the flat root (conftest.py, the entry script, etc.).
[tool.setuptools]
py-modules = ["COLLECT_PARSE_V3_23_0"]
include-package-data = false

[tool.setuptools.packages.find]
# The explicit webapp package keeps tests and source tooling out while package-data includes
# only the built SPA and synthetic demo snapshot needed by the installed AssessHub command.
include = ["cisco_toolkit*", "webapp", "webapp.backend"]

[tool.setuptools.package-data]
# Ship the runtime data inside any built distribution: the gzipped KB files portdb/ouidb load, and the
# single-file explorer template, verified registry manifest, complete AssessHub SPA, and synthetic
# demo snapshot. Every installed entry point is usable from an isolated wheel.
cisco_toolkit = [
    "data/*.tsv.gz",
    "data/registry_manifest.json",
    "data/eol-bulletins.json",
    "data/traffic-intents.example.json",
    "blast_radius_explorer.html",
]
webapp = ["frontend/dist/index.html", "frontend/dist/assets/*", "sample_data/*.json"]

[tool.coverage.run]
source = ["cisco_toolkit"]
# The 2700-line entry module joined the measured surface in Plan A / Move-0.2 (it is
# exercised in-process by tests/test_pipeline_inprocess.py driving main() directly).
# source_pkgs (not source): a top-level MODULE is an importable name, not a directory —
# and pytest-cov's --cov=<pkg> flags override `source` but leave source_pkgs intact.
source_pkgs = ["COLLECT_PARSE_V3_23_0"]
omit = ["cisco_toolkit/data/gen_port_registry.py"]   # offline data-generator script, not runtime code

[tool.coverage.report]
# Coverage is meaningful only because tests/test_pipeline_inprocess.py drives the workbook / HTML
# builders IN-PROCESS — the subprocess golden runs in a child the coverage tool can't see. The floor
# is enforced in CI via `--cov-fail-under` (kept a few points below the real number for headroom).
skip_covered = false
