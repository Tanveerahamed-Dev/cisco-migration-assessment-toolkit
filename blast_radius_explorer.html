<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Migration Explorer</title>
<style>
  /* ============================================================
     SEMANTIC DESIGN TOKENS  (Radix/Carbon-style: role-assigned,
     light + dark, temperature severity ramp, never neon-on-black)
     ============================================================ */
  :root, [data-theme="dark"]{
    --bg:#0e1116; --surface:#161b22; --surface-2:#1c2230; --surface-3:#222a39;
    --border:#2a313c; --border-strong:#3b4452; --border-faint:#21272f;
    --text:#e6edf3; --text-dim:#9aa7b4; --text-faint:#6b7785;
    --accent:#5b9dff; --accent-dim:#3d6fc0; --accent-soft:#14233c;
    --ok:#3fb950; --ok-soft:#11261a;
    --watch:#d8a800; --watch-soft:#2a2410;
    --risk:#f0883e; --risk-soft:#2a1c10;
    --crit:#f85149; --crit-soft:#2c1517;
    --shadow:0 6px 22px rgba(0,0,0,.45);
    --grid:#1a212b;
  }
  [data-theme="light"]{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f3f6fa; --surface-3:#e9eef4;
    --border:#d6dde6; --border-strong:#bcc6d2; --border-faint:#e6ebf1;
    --text:#1b2530; --text-dim:#586675; --text-faint:#8a96a4;
    --accent:#2563eb; --accent-dim:#5b86e0; --accent-soft:#e4eeff;
    --ok:#1a7f37; --ok-soft:#e7f5ec;
    --watch:#9a6700; --watch-soft:#fbf2d4;
    --risk:#bc4c00; --risk-soft:#fcecdc;
    --crit:#cf222e; --crit-soft:#ffeceb;
    --shadow:0 6px 22px rgba(40,55,80,.14);
    --grid:#e4e9f0;
  }
  :root{
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  /* ---- accessibility: visible focus rings + reduced motion (PHASE 3 P1) ---- */
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
  }
  #gnodes g.node:focus{outline:none}
  #gnodes g.node:focus-visible{outline:2.5px solid var(--accent); outline-offset:5px}
  /* screen-reader-only: visually hidden but available to assistive tech (PHASE 3 P1 increment 3) */
  .sr-only{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  .schema-warn{color:var(--watch); border-color:var(--watch); background:var(--watch-soft); max-width:420px}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      transition-duration:.001ms !important; animation-duration:.001ms !important;
      animation-iteration-count:1 !important; scroll-behavior:auto !important;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:13px; line-height:1.45; overflow:hidden; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-rows:auto 1fr; height:100vh}

  /* ---- header ---- */
  header{
    display:flex; align-items:center; gap:16px; padding:0 16px; height:54px;
    border-bottom:1px solid var(--border); background:var(--surface);
  }
  .brand{display:flex; align-items:baseline; gap:9px; flex-shrink:0}
  .brand b{font-size:14.5px; font-weight:650; letter-spacing:-.2px; color:var(--text)}
  .brand .mark{width:11px;height:11px;border-radius:3px;background:var(--accent);display:inline-block;
    box-shadow:0 0 0 3px var(--accent-soft)}
  .src{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600;
    border:1px solid var(--border); color:var(--text-dim); background:var(--surface-2);
    max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .src.live{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)}
  .grow{flex:1}

  /* ---- segmented mode switcher ---- */
  .modes{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:9px;
    border:1px solid var(--border)}
  .modes button{
    font:inherit; font-size:12px; font-weight:550; cursor:pointer; color:var(--text-dim);
    background:transparent; border:0; padding:6px 13px; border-radius:6px; display:flex; gap:6px;
    align-items:center; transition:.12s; white-space:nowrap;
  }
  .modes button:hover{color:var(--text)}
  .modes button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.25)}
  [data-theme="light"] .modes button.on{box-shadow:0 1px 2px rgba(40,55,80,.12)}
  .modes button .gl{font-size:13px; opacity:.85}

  .tools{display:flex; gap:6px; align-items:center; flex-shrink:0}
  .btn{
    font:inherit; font-size:12px; font-weight:550; cursor:pointer; color:var(--text-dim);
    background:var(--surface-2); border:1px solid var(--border); padding:6px 11px;
    border-radius:7px; transition:.12s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--border-strong); color:var(--text); background:var(--surface-3)}
  .btn.primary{color:#fff; background:var(--accent); border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-dim)}
  .iconbtn{padding:6px 9px}

  .main{display:grid; grid-template-columns:1fr 388px; min-height:0}

  /* ---- stage / canvas ---- */
  .stage{position:relative; min-height:0; overflow:hidden; background:var(--bg);
    background-image:radial-gradient(var(--grid) 1px, transparent 1px); background-size:26px 26px}
  svg{width:100%; height:100%; display:block; cursor:grab}
  svg.grabbing{cursor:grabbing}

  .overlay{position:absolute; display:flex; gap:8px; align-items:center; z-index:5}
  .ov-top{top:12px; left:12px; right:12px; flex-wrap:wrap}
  .ov-bottom{bottom:12px; left:12px; right:12px; justify-content:space-between; align-items:flex-end}
  .panelbox{background:var(--surface); border:1px solid var(--border); border-radius:9px;
    box-shadow:var(--shadow)}
  .search{display:flex; align-items:center; gap:7px; padding:6px 10px}
  .search input{font:inherit; font-size:12px; border:0; background:transparent; color:var(--text);
    outline:none; width:170px}
  .search input::placeholder{color:var(--text-faint)}
  .search .ic{color:var(--text-faint); font-size:12px}

  .chips{display:flex; gap:5px; align-items:center; flex-wrap:wrap; padding:6px 9px; max-width:64vw}
  .chips .lbl{color:var(--text-faint); font-size:10px; letter-spacing:.8px; text-transform:uppercase;
    font-weight:650; margin-right:3px}
  .chip{
    cursor:pointer; font-size:11.5px; font-weight:550; padding:3px 10px; border-radius:999px;
    border:1px solid var(--border); color:var(--text-dim); background:var(--surface-2); transition:.1s;
    user-select:none; line-height:1.5;
  }
  .chip:hover{color:var(--text); border-color:var(--border-strong)}
  .chip.on{color:#fff; background:var(--accent); border-color:var(--accent)}

  .legend{padding:9px 11px; font-size:11px; max-width:300px}
  .legend h4{margin:0 0 7px; font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--text-faint); font-weight:650}
  .legend .row{display:flex; align-items:center; gap:8px; margin:3px 0; color:var(--text-dim)}
  .legend .sw{width:22px; height:0; flex-shrink:0}
  .legend .swln{height:0; border-top-width:2.5px; border-top-style:solid}
  .legend .swbox{width:13px;height:13px;border-radius:3px;border:1.5px solid; flex-shrink:0}
  .modetag{padding:7px 11px; font-size:12px; color:var(--text-dim); max-width:46vw}
  .modetag b{color:var(--text)}

  .hint{padding:6px 11px; font-size:11.5px; color:var(--text-dim)}
  .hint b{color:var(--accent); font-weight:600}
  .kbd{font-family:var(--mono); font-size:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px; color:var(--text-dim)}

  /* ---- SVG node/link classes ---- */
  .lnk{fill:none; stroke:var(--border-strong); stroke-width:2; transition:stroke .2s, stroke-width .2s, stroke-opacity .2s}
  .lnk.fwd{stroke:var(--text-faint); stroke-opacity:.9}
  .lnk.blk{stroke:var(--watch); stroke-dasharray:3 5; stroke-opacity:.8}
  .lnk.pc{stroke-width:3.4}
  .lnk.dim{stroke-opacity:.16}
  .lnk.sev{stroke:var(--crit); stroke-width:3.4}
  .lnk.path{stroke:var(--accent); stroke-width:3.6; stroke-opacity:1}
  .lnk.heal{stroke:var(--ok); stroke-dasharray:8 6; animation:dash 1s linear infinite}
  .lnk.spof{stroke:var(--risk); stroke-width:3.8; stroke-dasharray:7 5; animation:dash 1.1s linear infinite}
  .lnk.flowpath{stroke:var(--accent); stroke-width:3.6}
  @keyframes dash{to{stroke-dashoffset:-28}}

  .pcbadge{fill:var(--surface); stroke:var(--border-strong); stroke-width:1}
  .pcbadge-t{fill:var(--text-dim); font:600 9px var(--mono); text-anchor:middle; pointer-events:none}

  .node{cursor:pointer}
  .node .body{fill:var(--surface-2); stroke:var(--border-strong); stroke-width:1.5; transition:.15s}
  .node:hover .body{stroke:var(--accent)}
  .node .stripe{fill:var(--accent)}
  .node.sel .body{stroke:var(--accent); stroke-width:3}
  .node.sel .halo{stroke:var(--accent); stroke-opacity:.3; stroke-width:7; fill:none}
  .node.dim{opacity:.32}
  .node.dead .body{fill:url(#hatch); stroke:var(--crit); stroke-width:2; stroke-dasharray:5 3}
  .node.match .body{stroke:var(--accent); stroke-width:2.5}
  .nname{fill:var(--text); font:650 12px var(--sans); text-anchor:middle; pointer-events:none}
  .nsub{fill:var(--text-dim); font:500 9.5px var(--mono); text-anchor:middle; pointer-events:none}
  .nrole{fill:var(--text-faint); font:650 8px var(--sans); letter-spacing:1px; text-anchor:middle; pointer-events:none; text-transform:uppercase}
  .epbadge{fill:var(--surface-3); stroke:var(--border); stroke-width:1}
  .epbadge-t{fill:var(--text-dim); font:600 9.5px var(--sans); text-anchor:middle; pointer-events:none}
  .ntag{font:700 8.5px var(--sans); letter-spacing:.6px; text-anchor:middle; pointer-events:none}
  .scorebadge{font:800 12px var(--sans); text-anchor:middle; pointer-events:none}

  /* ---- drawer ---- */
  aside{border-left:1px solid var(--border); background:var(--surface); overflow-y:auto}
  aside::-webkit-scrollbar{width:10px} aside::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:10px}
  aside::-webkit-scrollbar-track{background:transparent}
  .sec{padding:15px 17px; border-bottom:1px solid var(--border-faint)}
  .sec h3{margin:0 0 11px; font-size:10px; letter-spacing:1.3px; text-transform:uppercase;
    color:var(--text-faint); font-weight:700; display:flex; align-items:center; gap:7px}
  .sec h3 .ct{color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:1px 8px; font-size:10px; letter-spacing:0}
  .drawer-head{padding:16px 17px 4px}
  .drawer-head .eyebrow{font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-faint); font-weight:700}
  .drawer-head .title{font-size:17px; font-weight:650; color:var(--text); margin-top:3px; letter-spacing:-.2px;
    word-break:break-word; display:flex; align-items:center; gap:9px}
  .drawer-head .title .mono{font-family:var(--mono); font-size:14px}
  .sub{color:var(--text-dim)} .faint{color:var(--text-faint)}
  .mono{font-family:var(--mono)}

  .empty{padding:46px 24px; text-align:center; color:var(--text-faint)}
  .empty .big{font-size:30px; margin-bottom:12px; opacity:.5}
  .empty p{margin:6px 0; font-size:12.5px; line-height:1.6}
  .empty b{color:var(--text-dim)}

  .headline{display:flex; gap:9px}
  .stat{flex:1; text-align:center; padding:11px 7px; border:1px solid var(--border); border-radius:9px;
    background:var(--surface-2)}
  .stat .v{font-size:26px; font-weight:750; line-height:1; color:var(--text)}
  .stat .k{font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--text-faint); margin-top:6px; font-weight:600}
  .stat.crit{border-color:var(--crit); background:var(--crit-soft)} .stat.crit .v{color:var(--crit)}
  .stat.risk{border-color:var(--risk); background:var(--risk-soft)} .stat.risk .v{color:var(--risk)}
  .stat.ok .v{color:var(--ok)}
  .stat.accent{border-color:var(--accent); background:var(--accent-soft)} .stat.accent .v{color:var(--accent)}

  .badge{display:inline-flex; align-items:center; gap:6px; font-weight:650; font-size:11px;
    padding:4px 11px; border-radius:999px; border:1px solid}
  .b-crit{color:var(--crit); background:var(--crit-soft); border-color:var(--crit)}
  .b-risk{color:var(--risk); background:var(--risk-soft); border-color:var(--risk)}
  .b-watch{color:var(--watch); background:var(--watch-soft); border-color:var(--watch)}
  .b-ok{color:var(--ok); background:var(--ok-soft); border-color:var(--ok)}
  .b-neutral{color:var(--text-dim); background:var(--surface-2); border-color:var(--border)}

  table{width:100%; border-collapse:collapse; font-size:12px}
  th{text-align:left; color:var(--text-faint); font-weight:650; font-size:9.5px; letter-spacing:.6px;
    text-transform:uppercase; padding:0 7px 7px}
  td{padding:6px 7px; border-top:1px solid var(--border-faint); vertical-align:middle}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
  .vid{font-weight:700; color:var(--accent); font-family:var(--mono)}
  .pill{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:650; white-space:nowrap}
  .pl-crit{color:var(--crit); background:var(--crit-soft)} .pl-risk{color:var(--risk); background:var(--risk-soft)}
  .pl-watch{color:var(--watch); background:var(--watch-soft)} .pl-ok{color:var(--ok); background:var(--ok-soft)}
  .pl-neutral{color:var(--text-dim); background:var(--surface-2)}

  .card{border:1px solid var(--border); border-left-width:3px; border-radius:9px; padding:11px 13px; margin-bottom:9px;
    background:var(--surface-2)}
  .card.crit{border-left-color:var(--crit)} .card.risk{border-left-color:var(--risk)}
  .card.watch{border-left-color:var(--watch)} .card.ok{border-left-color:var(--ok)}
  .card.accent{border-left-color:var(--accent)}
  .card .ct{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
  .card .nm{font-weight:650; font-size:12.5px; color:var(--text)}
  .card .ln{font-size:11.5px; color:var(--text-dim); margin:3px 0; line-height:1.5}
  .card .ln b{color:var(--text)}
  .card .fix{font-size:11.5px; color:var(--text-dim); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border)}
  .card .fix b{color:var(--ok)}
  .epdrill{margin-top:7px}
  .epdrill>summary{cursor:pointer; font-size:11px; color:var(--text-dim); user-select:none; padding:3px 0}
  .epdrill>summary:hover{color:var(--text)}
  .epdrill>summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .epdrill .eplh{font-size:10px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; margin:7px 0 3px}
  .epdrill .eplh.ok{color:var(--ok)} .epdrill .eplh.crit{color:var(--crit)}
  .epdrill .eprow{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12px; padding:3px 0; border-top:1px solid var(--border-faint)}

  .bar{height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden; margin:4px 0}
  .bar i{display:block; height:100%; border-radius:999px}

  .kv{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12px; border-top:1px solid var(--border-faint)}
  .kv:first-child{border-top:0}
  .kv .k{color:var(--text-dim)} .kv .v{color:var(--text); font-weight:550; text-align:right; word-break:break-word}

  .checkrow{display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--border-faint); font-size:12px}
  .checkrow .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
  .checkrow .nm{font-weight:600; color:var(--text)} .checkrow .nt{color:var(--text-dim); font-size:11.5px; margin-top:1px}

  .hopline{position:relative; padding-left:22px}
  .hop{position:relative; padding:7px 0; font-size:12px}
  .hop::before{content:""; position:absolute; left:-16px; top:11px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .hop.spof::before{background:var(--risk); box-shadow:0 0 0 3px var(--risk-soft)}
  .hopline::after{content:""; position:absolute; left:-12px; top:6px; bottom:6px; width:2px; background:var(--border)}
  .hop .l1{font-weight:600; color:var(--text)} .hop .l2{color:var(--text-dim); font-size:11px; margin-top:1px}
  .lp{font-family:var(--mono); font-size:11px; color:var(--text-dim)}

  .foot{padding:13px 17px; color:var(--text-faint); font-size:10.5px; line-height:1.6}
  .foot b{color:var(--text-dim)}

  /* drop + help overlays */
  .drop{position:fixed; inset:0; background:rgba(10,14,20,.86); display:none; align-items:center; justify-content:center;
    z-index:50; backdrop-filter:blur(3px)}
  .drop.on{display:flex}
  .drop > div{border:2px dashed var(--accent); border-radius:16px; padding:48px 64px; font-size:17px; color:var(--text);
    background:var(--surface)}
  .drop b{color:var(--accent)}
  .modal{position:fixed; inset:0; background:rgba(10,14,20,.6); display:none; align-items:center; justify-content:center; z-index:60}
  .modal.on{display:flex}
  .modal .box{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px 26px;
    max-width:440px; box-shadow:var(--shadow)}
  .modal h2{margin:0 0 14px; font-size:15px} .modal .close{float:right; cursor:pointer; color:var(--text-faint); font-size:18px}
  .modal .krow{display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; border-top:1px solid var(--border-faint)}
  .modal .krow span:first-child{color:var(--text-dim)}
</style>
</head>
<body>
<div class="app">
  <header role="banner">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Network Migration Explorer</b></div>
    <span class="src" id="src">DEMO</span>
    <span class="src schema-warn" id="schemaWarn" role="alert" hidden></span>
    <div class="grow"></div>
    <div class="modes" id="modes" role="group" aria-label="View mode">
      <button data-mode="blast" class="on" aria-pressed="true"><span class="gl" aria-hidden="true">◎</span>Blast radius</button>
      <button data-mode="trace" aria-pressed="false"><span class="gl" aria-hidden="true">↝</span>Path trace</button>
      <button data-mode="compare" aria-pressed="false"><span class="gl" aria-hidden="true">⇄</span>Compare</button>
      <button data-mode="flow" aria-pressed="false"><span class="gl" aria-hidden="true">⚡</span>Flow</button>
      <button data-mode="health" aria-pressed="false"><span class="gl" aria-hidden="true">✚</span>Health</button>
    </div>
    <div class="grow"></div>
    <div class="tools">
      <button class="btn" id="loadBtn" aria-label="Load a snapshot file"><span aria-hidden="true">↥</span> Load</button>
      <button class="btn iconbtn" id="layoutBtn" title="Toggle layered / radial layout" aria-label="Toggle layered or radial layout">⊞</button>
      <button class="btn iconbtn" id="fitBtn" title="Fit to screen (F)" aria-label="Fit graph to screen">⤢</button>
      <button class="btn iconbtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
      <button class="btn iconbtn" id="helpBtn" title="Keyboard shortcuts (?)" aria-label="Show keyboard shortcuts">?</button>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <input type="file" id="fileB" accept=".json,application/json" hidden>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <div class="overlay ov-top">
        <div class="panelbox search"><span class="ic" aria-hidden="true">⌕</span>
          <input id="search" placeholder="Search switch, IP, MAC…" autocomplete="off" aria-label="Search switches, IPs, or MACs"></div>
        <div class="panelbox chips" id="chips"></div>
        <div class="panelbox modetag" id="modetag"></div>
      </div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Network topology graph"></svg>
      <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="srTable" class="sr-only" role="region" aria-label="Topology as a table"></div>
      <div class="overlay ov-bottom">
        <div class="panelbox hint" id="hint"></div>
        <div class="panelbox legend" id="legend"></div>
      </div>
    </div>
    <aside id="panel" aria-label="Details panel"></aside>
  </div>
</div>

<div class="drop" id="drop"><div>Drop your <b>snapshot.json</b> to load</div></div>
<div class="modal" id="help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"><div class="box">
  <span class="close" id="helpClose" role="button" tabindex="0" aria-label="Close">✕</span>
  <h2>Keyboard shortcuts</h2>

function linkCarries(L,vid){if(L.fwd.has(vid))return "fwd";if(L.blk.has(vid))return "blk";
  if(L.allowed===null||L.allowed.has(vid))return "fwd";return "";}

    while(st.length){const cur=st.pop();for(const li of model.adj.get(cur)){const L=model.links[li];
      if(L.a===removed||L.b===removed)continue;const c=linkCarries(L,vid);
      if(c!=="fwd"&&!(backup&&c==="blk"))continue;const nx=L.a===cur?L.b:L.a;
      if(!part.has(nx)||seen.has(nx))continue;seen.add(nx);comp.add(nx);st.push(nx);}}comps.push(comp);}

const compIndexOf=(comps,h)=>{for(let i=0;i<comps.length;i++)if(comps[i].has(h))return i;return -1;};

function causalityChains(model){

      title:`Sole-gateway SPOF · VLAN ${vid}`,
      root:`${gw} is the only in-scan gateway for VLAN ${vid} and has no FHRP standby.`,
      mech:`If ${gw} drops, every VLAN-${vid} endpoint loses its default gateway — no failover exists.`,
      blast:`${elsewhere} endpoint(s) on other switches go gateway-less.`,

          mech:healed?`Removing ${host} drops the active path; an STP-blocked link re-converges to heal it (transient outage).`

          blast:`${r.strandedActive} collateral endpoint(s)${healed?" (recover after STP re-converges)":" stranded"}.`,
          fix:healed?`Confirm STP re-convergence time is acceptable; consider a port-channel for sub-second failover.`

function _bfsPath(model,vid,src,dst,bk,exL=-1,exH=null){if(src===dst)return [src];

    for(const li of model.adj.get(cur)){if(li===exL)continue;const L=model.links[li];

/* =====================================================================
   LAYOUT ENGINE — role-tiered layered (Sugiyama-style) + radial.
   Replaces the old force-directed "wheel". Ranks are derived from
   device role (gateways/degree) + BFS, with barycenter crossing
   reduction within tiers. (Gansner et al.; van der Maaten/Sugiyama)
   ===================================================================== */
function distinctDeg(model,h){const s=new Set();for(const li of model.adj.get(h)){const L=model.links[li];s.add(L.a===h?L.b:L.a);}return s.size;}
function deviceRole(model,h){
  // Core/distribution = a topological hub (high distinct-neighbor degree). A management SVI
  // alone must NOT promote an access switch, so role is degree-driven, not gateway-driven.
  const deg=distinctDeg(model,h);
  const maxDeg=Math.max(1,...model.hosts.map(x=>distinctDeg(model,x)));
  return deg>=Math.max(3,maxDeg*0.5)?"core":"access";
}
function roleTiers(model){
  const core=model.hosts.filter(h=>deviceRole(model,h)==="core");
  const seed = core.length? core : [model.hosts.slice().sort((a,b)=>model.adj.get(b).length-model.adj.get(a).length)[0]].filter(Boolean);
  const tier=new Map(); seed.forEach(h=>tier.set(h,0));
  let q=seed.slice();
  while(q.length){const nx=[]; for(const cur of q){const t=tier.get(cur);
    for(const li of model.adj.get(cur)){const L=model.links[li]; const o=L.a===cur?L.b:L.a;
      if(!tier.has(o)){tier.set(o,t+1);nx.push(o);}}}
    q=nx;}
  let maxT=0; tier.forEach(v=>maxT=Math.max(maxT,v));
  model.hosts.forEach(h=>{if(!tier.has(h))tier.set(h,maxT+1);}); // isolated → bottom
  maxT=0; tier.forEach(v=>maxT=Math.max(maxT,v));
  const tiers=Array.from({length:maxT+1},()=>[]);
  model.hosts.forEach(h=>tiers[tier.get(h)].push(h));
  // barycenter ordering vs the tier above (a few sweeps) to cut crossings
  tiers.forEach(t=>t.sort((a,b)=>a.localeCompare(b)));
  for(let sweep=0; sweep<4; sweep++){
    for(let k=1;k<tiers.length;k++){const above=tiers[k-1]; const idx=new Map(above.map((h,i)=>[h,i]));
      const bc=h=>{const ns=[]; for(const li of model.adj.get(h)){const L=model.links[li]; const o=L.a===h?L.b:L.a;
        if(idx.has(o))ns.push(idx.get(o));} return ns.length? ns.reduce((s,x)=>s+x,0)/ns.length : 1e9;};
      tiers[k]=tiers[k].map(h=>[h,bc(h)]).sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).map(x=>x[0]);}
  }
  return {tier,tiers};
}
const COLW=210, ROWH=180, PADX=120, PADY=110;
function layeredLayout(model){
  const {tiers}=roleTiers(model);
  const widest=Math.max(1,...tiers.map(t=>t.length));
  const logicalW=PADX*2+(widest-1)*COLW;
  const pos={};
  tiers.forEach((t,k)=>{const n=t.length; const rowW=(n-1)*COLW; const x0=(logicalW-rowW)/2;
    t.forEach((h,i)=>pos[h]={x:x0+i*COLW, y:PADY+k*ROWH});});
  const logicalH=PADY*2+(tiers.length-1)*ROWH;
  return {pos,logicalW,logicalH};
}
function radialLayout(model){
  const {tiers}=roleTiers(model);
  const ring=190, cx=0, cy=0; const pos={};
  tiers.forEach((t,k)=>{const n=t.length;
    if(k===0&&n===1){pos[t[0]]={x:cx,y:cy};return;}
    const r=(k===0? ring*0.6 : ring*k); const off=(k%2)*0.25;
    t.forEach((h,i)=>{const ang=(i/n)*2*Math.PI - Math.PI/2 + off;
      pos[h]={x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r};});});
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const h in pos){minx=Math.min(minx,pos[h].x);miny=Math.min(miny,pos[h].y);
    maxx=Math.max(maxx,pos[h].x);maxy=Math.max(maxy,pos[h].y);}
  for(const h in pos){pos[h].x+=(-minx+PADX);pos[h].y+=(-miny+PADY);}
  return {pos,logicalW:(maxx-minx)+PADX*2,logicalH:(maxy-miny)+PADY*2};
}

  consider.forEach(r=>{if(r.cls==="No impact")return; const tok=sevToken(r.sev);
    for(const [h,m] of MODEL.endpoints){if(h===SEL)continue;if(m.get(r.vid)){
      if(!affected.has(h)||rank[tok]>rank[affected.get(h)])affected.set(h,tok);}}});
  affected.forEach((tok,h)=>{const nn=nodeEls[h]; nn.body.style.stroke=`var(--${tok})`;
    nn.body.style.fill=`var(--${tok}-soft)`;});
  // edges touching SEL → severity

}
function visEdgeHasIdx(e,idxSet){return e.idxs.some(i=>idxSet.has(i));}
function paintTrace(){
  if(TRACE_SRC){nodeEls[TRACE_SRC].g.classList.add("sel");nodeEls[TRACE_SRC].tag.textContent="SOURCE";nodeEls[TRACE_SRC].tag.setAttribute("fill","var(--accent)");}
  if(TRACE_DST){nodeEls[TRACE_DST].g.classList.add("sel");nodeEls[TRACE_DST].tag.textContent="DEST";nodeEls[TRACE_DST].tag.setAttribute("fill","var(--accent)");}
  if(!TRACE||!TRACE.reachable||TRACE.trivial)return;
  const pathSet=new Set(TRACE.path); const bridgeSet=new Set(TRACE.bridges); const articSet=new Set(TRACE.artic);
  // path edges
  const pathPairs=new Set(); for(let i=0;i<TRACE.path.length-1;i++)pathPairs.add([TRACE.path[i],TRACE.path[i+1]].sort().join("::"));
  edgeEls.forEach(({e,path})=>{const key=[e.a,e.b].sort().join("::");
    if(pathPairs.has(key)){const spof=visEdgeHasIdx(e,bridgeSet);
      path.className.baseVal="lnk "+(spof?"spof":"path")+(e.pc?" pc":"");}});
  TRACE.path.forEach(h=>{if(h!==TRACE_SRC&&h!==TRACE_DST){nodeEls[h].body.style.stroke="var(--accent)";}});
  articSet.forEach(h=>{nodeEls[h].body.style.stroke="var(--risk)";nodeEls[h].body.style.fill="var(--risk-soft)";
    nodeEls[h].tag.textContent="SPOF";nodeEls[h].tag.setAttribute("fill","var(--risk)");});
}
function paintCompare(){
  if(!CMP)return; const worse=new Set(CMP.switchDeltas.filter(d=>d.direction==="worse").map(d=>d.host));
  const better=new Set(CMP.switchDeltas.filter(d=>d.direction==="better").map(d=>d.host));
  const removed=new Set(CMP.switchesRemoved);
  MODEL.hosts.forEach(h=>{const n=nodeEls[h];
    if(removed.has(h)){n.g.classList.add("dead");n.tag.textContent="REMOVED";n.tag.setAttribute("fill","var(--crit)");}
    else if(worse.has(h)){n.body.style.stroke="var(--crit)";n.body.style.fill="var(--crit-soft)";n.tag.textContent="REGRESSED";n.tag.setAttribute("fill","var(--crit)");}
    else if(better.has(h)){n.body.style.stroke="var(--ok)";n.body.style.fill="var(--ok-soft)";n.tag.textContent="IMPROVED";n.tag.setAttribute("fill","var(--ok)");}});
}
function flowObj(){return SNAP&&SNAP.flow_trace?SNAP.flow_trace:null;}
function paintFlow(){
  if(FLOWRES){const F=FLOWRES;
    if(F.src&&nodeEls[F.src.host]){nodeEls[F.src.host].g.classList.add("sel");nodeEls[F.src.host].tag.textContent="SOURCE";nodeEls[F.src.host].tag.setAttribute("fill","var(--accent)");}
    if(F.dst&&nodeEls[F.dst.host]){nodeEls[F.dst.host].g.classList.add("sel");nodeEls[F.dst.host].tag.textContent="DEST";nodeEls[F.dst.host].tag.setAttribute("fill","var(--accent)");}
    MODEL.hosts.forEach(h=>{const n=nodeEls[h];
      if(!F.pathHosts.has(h)){n.g.classList.add("dim");}
      else if(h!==F.src.host&&h!==F.dst.host){n.body.style.stroke="var(--accent)";}});
    (F.gateways||[]).forEach(g=>{if(nodeEls[g]){nodeEls[g].tag.textContent="GATEWAY";nodeEls[g].tag.setAttribute("fill","var(--accent)");}});
    edgeEls.forEach(({e,path})=>{path.className.baseVal=(visEdgeHasIdx(e,F.linkIdxs)?"lnk flowpath":"lnk dim")+(e.pc?" pc":"");});
    return;
  }
  const f=flowObj(); if(!f||!f.hops)return;
  const onPath=new Set(); f.hops.forEach(h=>{if(h.from)onPath.add(h.from);if(h.to)onPath.add(h.to);});
  const spof=new Set((f.summary&&f.summary.spofs||[]).map(String));
  MODEL.hosts.forEach(h=>{const n=nodeEls[h];
    if(!onPath.has(h)){n.g.classList.add("dim");return;}
    if(spof.has(h)){n.body.style.stroke="var(--risk)";n.body.style.fill="var(--risk-soft)";
      n.tag.textContent="SPOF";n.tag.setAttribute("fill","var(--risk)");}
    else{n.body.style.stroke="var(--accent)";}});
  const pairs=new Set(); f.hops.forEach(h=>{if(h.from&&h.to)pairs.add([h.from,h.to].sort().join("::"));});
  edgeEls.forEach(({e,path})=>{const key=[e.a,e.b].sort().join("::");
    if(pairs.has(key))path.className.baseVal="lnk flowpath"+(e.pc?" pc":"");
    else path.className.baseVal="lnk dim"+(e.pc?" pc":"");});
}
function healthList(){return SNAP&&SNAP.health_scores?SNAP.health_scores:[];}
function healthBandToken(band){const b=(band||"").toLowerCase();
  if(b.includes("excellent"))return "ok"; if(b.includes("good"))return "ok";
  if(b.includes("fair"))return "watch"; if(b.includes("poor"))return "risk";
  if(b.includes("critical"))return "crit"; return "neutral";}
function scoreToken(s){return s>=75?"ok":s>=60?"watch":s>=40?"risk":"crit";}

/* ---- keyboard navigation of the graph (PHASE 3 P1 increment 2) ---- */
function buildNavOrder(){
  if(!MODEL){NAV=[];NAVI=0;return;}
  NAV=MODEL.hosts.slice().sort((a,b)=>(POS[a].y-POS[b].y)||(POS[a].x-POS[b].x));
  NAVI=NAV.indexOf(SEL); if(NAVI<0)NAVI=0;
  setRoving();
}
function setRoving(){NAV.forEach((h,i)=>{const n=nodeEls[h]; if(n)n.g.setAttribute("tabindex",i===NAVI?"0":"-1");});}
function focusNodeAt(i){if(!NAV.length)return; NAVI=(i%NAV.length+NAV.length)%NAV.length; setRoving();
  const n=nodeEls[NAV[NAVI]]; if(n)n.g.focus();}
/* PHASE E: 2D spatial arrow-nav — the nearest node in the pressed direction (dir = a unit axis vector).
   cost = distance ALONG the direction + 2x the perpendicular offset, so an aligned node wins over a skewed one;
   nodes not in the pressed direction are excluded, so at an edge the key is a no-op (no wrap). */
function spatialNeighbor(h,dx0,dy0){
  if(!POS[h])return null;
  const cx=POS[h].x, cy=POS[h].y; let best=null, bestCost=Infinity;
  for(const o of NAV){ if(o===h||!POS[o])continue;
    const dx=POS[o].x-cx, dy=POS[o].y-cy;
    const along=dx*dx0+dy*dy0; if(along<=1e-6)continue;
    const cost=along+2*Math.abs(dx*dy0-dy*dx0);
    if(cost<bestCost){bestCost=cost; best=o;} }
  return best;
}
function onNodeKey(ev,h){
  const k=ev.key;
  if(k==="Enter"||k===" "){ev.preventDefault(); onNodeClick(h); return;}
  if(k==="Home"){ev.preventDefault(); focusNodeAt(0); return;}
  if(k==="End"){ev.preventDefault(); focusNodeAt(NAV.length-1); return;}
  const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[k];
  if(!dir)return;
  ev.preventDefault();
  const t=spatialNeighbor(h,dir[0],dir[1]);   // 2D directional move; stay put at the edge
  if(t!==null)focusNodeAt(NAV.indexOf(t));
}

/* PHASE F: render the "L4 filtering" card from a list of {host,vid,dir,name}; "" when empty. */
function aclFlagCard(flags,lead){
  if(!flags||!flags.length)return "";
  const items=flags.map(a=>`ACL <span class="mono">${esc(a.name)}</span> on ${esc(shortName(a.host))} VLAN ${a.vid} (${esc(a.dir)})`).join("; ");
  return `<div class="card watch" style="margin:0 0 8px"><div class="ln"><b>⚠ L4 filtering on ${esc(lead)}.</b> ${items}. ACLs are collected from run-config but not evaluated here, so this path may still be permitted or denied at L4.</div></div>`;
}
/* ---- per-endpoint reachability (PHASE B): pure, offline, L1-L3 from the embedded snapshot ---- */
/* PHASE D drill-down: named endpoints on host h in VLAN v (count matches MODEL.endpoints — one per access port) */
function epsOn(h,v){return endpointsOf(h).filter(e=>/^\d+$/.test(e.vlan)&&+e.vlan===v);}
function endpointReach(ep){
  const vid=/^\d+$/.test(ep.vlan)?+ep.vlan:null;
  const R={vid, host:ep.host, gateways:[], groups:[], reachHosts:new Set([ep.host]), unreachHosts:new Set(),
           reachEps:0, unreachEps:0, note:""};
  if(vid==null){R.note="Endpoint VLAN unknown — reachability cannot be analyzed."; return R;}
  const gws=[...(MODEL.gateways.get(vid)||new Set())].sort();
  R.gateways=gws;
  const pathTo=(h,v)=> h===ep.host ? [h] : _bfsPath(MODEL, v, ep.host, h);   // null = no STP-forwarding path
  const egress=gws.some(g=>pathTo(g,vid)!==null);
  gws.forEach(g=>{if(pathTo(g,vid)!==null)R.reachHosts.add(g);});
  const vmap=new Map();
  for(const [h,m] of MODEL.endpoints)for(const [v,c] of m){if(c<=0)continue; if(!vmap.has(v))vmap.set(v,[]); vmap.get(v).push([h,c]);}
  const hostsWithEps=new Set(); for(const arr of vmap.values())for(const [h] of arr)hostsWithEps.add(h);
  for(const [v,arr] of [...vmap.entries()].sort((a,b)=>a[0]-b[0])){
    let reach=0, unreach=0; const reasons=new Set();
    const reachList=[], unreachList=[];                    // PHASE D: the named endpoints behind the counts
    if(v===vid){
      for(const [h,c] of arr){ if(pathTo(h,vid)!==null){reach+=c; R.reachHosts.add(h); reachList.push(...epsOn(h,v));}
        else {unreach+=c; reasons.add(`VLAN ${v} is partitioned — no STP-forwarding path to ${h}`); unreachList.push(...epsOn(h,v));} }
      R.groups.push({vlan:v, kind:"same subnet (L2)", reach, unreach, reasons:[...reasons], reachList, unreachList});
    } else {
      const dgw=[...(MODEL.gateways.get(v)||new Set())];
      if(!egress){ unreach=arr.reduce((s,[,c])=>s+c,0); for(const [h] of arr)unreachList.push(...epsOn(h,v));
        R.groups.push({vlan:v, kind:"different subnet", reach:0, unreach,
          reasons:[gws.length?`no STP-forwarding path from ${ep.host} to a VLAN ${vid} gateway`
                             :`VLAN ${vid} has no gateway (SVI) — endpoints can't leave the subnet`], reachList, unreachList}); }
      else if(dgw.length===0){ unreach=arr.reduce((s,[,c])=>s+c,0); for(const [h] of arr)unreachList.push(...epsOn(h,v));
        R.groups.push({vlan:v, kind:"different subnet", reach:0, unreach,
          reasons:[`VLAN ${v} has no gateway — no inter-subnet routing target`], reachList, unreachList}); }
      else { for(const [h,c] of arr){ if(dgw.some(g=>h===g||_bfsPath(MODEL,v,h,g)!==null)){reach+=c; R.reachHosts.add(h); reachList.push(...epsOn(h,v));}
          else {unreach+=c; reasons.add(`VLAN ${v} is partitioned at ${h}`); unreachList.push(...epsOn(h,v));} }
        R.groups.push({vlan:v, kind:"via L3 gateway", reach, unreach, reasons:[...reasons], reachList, unreachList}); }
    }
    R.reachEps+=reach; R.unreachEps+=unreach;
  }
  for(const h of hostsWithEps)if(!R.reachHosts.has(h))R.unreachHosts.add(h);
  R.aclFlags=[];   // PHASE F: ACLs on gateway SVIs along this endpoint's reachable inter-subnet paths
  {const seen=new Set(); const add=(g,v,dir)=>{const a=gwAcl(g,v),nm=a&&a[dir],k=g+"|"+v+"|"+dir;
     if(nm&&!seen.has(k)){seen.add(k); R.aclFlags.push({host:g,vid:v,dir,name:nm});}};
   gws.forEach(g=>{if(R.reachHosts.has(g))add(g,vid,"in");});                                  // egress: leaving this subnet (acl_in on own SVI)
   for(const grp of R.groups){if(grp.vlan===vid||grp.reach<=0)continue;
     for(const g of (MODEL.gateways.get(grp.vlan)||new Set()))if(R.reachHosts.has(g))add(g,grp.vlan,"out");}}  // ingress: entering a reachable dst subnet (acl_out)
  return R;
}
/* PHASE D drill-down: collapsible list of the named endpoints behind each VLAN's reach/unreach counts */
function epListRows(list){return list.map(e=>{
  const id=esc(e.ip||e.mac||e.port);
  const self=(EPSEL&&e.host===EPSEL.host&&e.port===EPSEL.port)?' <span class="pill pl-ok">this endpoint</span>':"";
  return `<div class="eprow"><span class="mono">${id}${self}</span><span class="faint mono">${esc(shortName(e.host))} ${esc(e.port)}</span></div>`;}).join("");}
function epDrill(g){const total=g.reachList.length+g.unreachList.length; if(!total)return "";
  return `<details class="epdrill"><summary>Show ${total} endpoint${total===1?"":"s"}</summary>`+
    (g.reachList.length?`<div class="eplh ok">✓ Can reach (${g.reachList.length})</div>${epListRows(g.reachList)}`:"")+
    (g.unreachList.length?`<div class="eplh crit">✗ Cannot reach (${g.unreachList.length})</div>${epListRows(g.unreachList)}`:"")+
    `</details>`;}
function reachSection(R){
  if(!R)return "";
  if(R.note)return `<div class="sec"><p class="faint">${esc(R.note)}</p></div>`;
  const rows=R.groups.map(g=>{const tok=g.reach===0?"crit":g.unreach>0?"watch":"ok";
    return `<div class="card ${tok}" style="margin-bottom:7px"><div class="ct"><span class="nm">VLAN ${g.vlan} <span class="faint">· ${esc(g.kind)}</span></span>`+
      `<span class="pill pl-${tok}">${g.reach} ✓ / ${g.unreach} ✗</span></div>`+
      (g.unreach>0&&g.reasons.length?`<div class="ln faint">${esc(g.reasons[0])}</div>`:"")+
      epDrill(g)+`</div>`;}).join("");
  return `<div class="sec"><h3>Reachability <span class="ct">L1–L3</span></h3>
    <div class="headline">
      <div class="stat ok"><div class="v">${R.reachEps}</div><div class="k">can reach</div></div>
      <div class="stat ${R.unreachEps?"crit":""}"><div class="v">${R.unreachEps}</div><div class="k">cannot reach</div></div>
    </div>
    ${aclFlagCard(R.aclFlags,"the gateway path")}
    <div style="margin-top:10px">${rows||'<p class="faint">No other endpoints in scope.</p>'}</div>
    <p class="faint" style="margin-top:9px"><b>L1–L3 only.</b> Computed from VLAN membership, STP forwarding and gateways — <b>ACLs are collected from run-config but not evaluated</b>, so a path shown reachable may still be blocked at L4.</p></div>`;
}
function paintEndpointReach(){
  if(!EPSEL||!REACH)return; const R=REACH; const gw=new Set(R.gateways);
  MODEL.hosts.forEach(h=>{const n=nodeEls[h];
    if(h===EPSEL.host){n.g.classList.add("match");}
    else if(R.reachHosts.has(h)){n.body.style.stroke="var(--ok)";n.body.style.fill="var(--ok-soft)";}
    else if(R.unreachHosts.has(h)){n.body.style.stroke="var(--crit)";n.body.style.fill="var(--crit-soft)";}
    if(gw.has(h)){n.tag.textContent="GATEWAY";n.tag.setAttribute("fill","var(--accent)");}});
}

      <div class="title"><span class="mono">${esc(shortName(TRACE_SRC))}</span> → <span class="mono">${esc(shortName(TRACE_DST))}</span></div></div>
    <div class="sec"><div class="headline">
      <div class="stat"><div class="v">${hops}</div><div class="k">hops</div></div>
      <div class="stat ${spofL?"crit":"ok"}"><div class="v">${spofL}</div><div class="k">SPOF links</div></div>
      <div class="stat ${spofS?"crit":"ok"}"><div class="v">${spofS}</div><div class="k">SPOF switches</div></div>
    </div>
    <div style="margin-top:11px" class="sub">${spofL||spofS?
      `This path has single points of failure. ${TRACE.backupPath?'A backup path would re-converge after STP (transient outage).':'No backup path — loss is a permanent partition.'}`
      :"Fully resilient — alternate path at every hop."}</div></div>
    ${chain}`;
}

/* ---- L4 ACL evaluation (PHASE G2): walk an ACL vs a 5-tuple, first-match-wins, implicit deny ---- */
function aclRules(host,name){return (SNAP&&SNAP.acls&&SNAP.acls[host])?(SNAP.acls[host][name]||null):null;}
function _ip2int(ip){const p=String(ip).split("."); if(p.length!==4)return null;
  let n=0; for(const o of p){const x=+o; if(!(x>=0&&x<=255)||o==="")return null; n=n*256+x;} return n>>>0;}
function _ipInSpec(ip,spec){ if(!spec||spec.group!=null)return null;     // object-group -> can't tell
  const a=_ip2int(ip), base=_ip2int(spec.ip), wild=_ip2int(spec.wild);
  if(a==null||base==null||wild==null)return null;
  const mask=(~wild)>>>0; return ((a&mask)>>>0)===((base&mask)>>>0);}
function _portMatch(p,port){ if(!p)return true;                          // rule has no port condition
  if(port==null)return null;                                            // flow port unknown but rule cares
  const v=p.val; if(v==null)return null;
  switch(p.op){case"eq":return port===v; case"neq":return port!==v; case"gt":return port>v; case"lt":return port<v;
    case"range":return p.val2==null?null:(port>=v&&port<=p.val2); default:return null;}}
function _protoMatch(rp,fp){rp=(rp||"ip").toLowerCase(); fp=(fp||"ip").toLowerCase();
  return rp==="ip"?true:rp===fp;}                                       // an 'ip' rule matches any protocol
/* H2: resolve object-group references so group-based rules evaluate definitively (not INDETERMINATE) */
function _specMatch(ip,spec){                                          // one concrete member -> true/false/null
  if(spec.rangeStart&&spec.rangeEnd){const a=_ip2int(ip),s=_ip2int(spec.rangeStart),e=_ip2int(spec.rangeEnd);
    return (a==null||s==null||e==null)?null:(a>=s&&a<=e);}
  return _ipInSpec(ip,spec);}
function _resolveGroup(name,host,seen){                                // object-group members -> flat concrete specs; null if the group is absent
  const tbl=(SNAP&&SNAP.object_groups&&SNAP.object_groups[host])?SNAP.object_groups[host]:null;
  const og=tbl?tbl[name]:null; if(!og)return null;
  seen=seen||new Set(); if(seen.has(name))return []; seen.add(name);   // guard cyclic group-object nesting
  const out=[]; for(const m of (og.members||[])){
    if(m&&m.group!=null){const sub=_resolveGroup(m.group,host,seen); if(sub===null)return null; for(const x of sub)out.push(x);}
    else if(m)out.push(m);}
  return out;}
function _addrMatch(ip,spec,host){                                     // {ip,wild} | {group} | {rangeStart,rangeEnd} -> true/false/null
  if(!spec)return null;
  if(spec.group!=null){const specs=_resolveGroup(spec.group,host); if(specs===null)return null;
    let sawNull=false; for(const s of specs){const r=_specMatch(ip,s); if(r===true)return true; if(r===null)sawNull=true;}
    return sawNull?null:false;}                                        // matches ANY member; null only if a member is itself unresolvable
  return _specMatch(ip,spec);}
function evalAcl(rules,flow,host){                                      // flow={src,dst,proto,dport} -> {action,rule,idx}
  for(let i=0;i<(rules||[]).length;i++){const r=rules[i];
    if(_protoMatch(r.proto,flow.proto)===false)continue;                // proto definitively differs -> skip
    const sm=_addrMatch(flow.src,r.src,host), dm=_addrMatch(flow.dst,r.dst,host), pm=_portMatch(r.dport,flow.dport);
    if(sm===false||dm===false||pm===false)continue;                     // a component definitively rules it out
    const groupRef=(r.src&&r.src.group!=null)||(r.dst&&r.dst.group!=null);
    const otherUneval=r.unevaluable&&!groupRef;                         // unevaluable for a reason H2 can't resolve (unknown port / unparseable addr)
    if(otherUneval||sm===null||dm===null||pm===null)                    // might match but can't be sure -> stop here
      return {action:"indeterminate",rule:r,idx:i};
    return {action:r.action,rule:r,idx:i};                              // proto + src + dst + port all matched
  }
  return {action:"deny",rule:null,idx:-1,implicit:true};                // fell off the end -> implicit deny
}
function aclVerdictCard(verdicts,proto,dport){
  if(!verdicts||!verdicts.length)return "";
  const tuple=`${String(proto).toUpperCase()}${(proto==="tcp"||proto==="udp")?"/"+dport:""}`;
  const worst=verdicts.some(v=>v.verdict==="deny")?"deny":verdicts.some(v=>v.verdict==="indeterminate")?"indeterminate":"permit";
  const tok=worst==="deny"?"crit":worst==="indeterminate"?"watch":"ok";
  const head=worst==="deny"?`✗ Blocked at L4 · ${esc(tuple)}`:worst==="indeterminate"?`? L4 indeterminate · ${esc(tuple)}`:`✓ Allowed at L4 · ${esc(tuple)}`;
  const rows=verdicts.map(v=>{const vt=v.verdict==="deny"?"crit":v.verdict==="indeterminate"?"watch":"ok";
    const mark=v.verdict==="deny"?"✗":v.verdict==="indeterminate"?"?":"✓";
    const why=v.verdict==="indeterminate"
        ?(v.nobody?"ACL body not in snapshot — can't evaluate":(v.rule?`rule ${v.idx+1} can't be modeled: ${esc(v.rule.raw)}`:"no rule conclusively matched"))
        :(v.implicit?"implicit deny — no rule matched":(v.rule?`rule ${v.idx+1}: ${esc(v.rule.raw)}`:""));
    return `<div class="ln"><span class="pill pl-${vt}">${mark} ${v.verdict.toUpperCase()}</span> ACL <span class="mono">${esc(v.name)}</span> on ${esc(shortName(v.host))} VLAN ${v.vid} (${esc(v.dir)})<div class="faint" style="margin-top:2px">${why}</div></div>`;}).join("");
  return `<div class="card ${tok}" style="margin:0 0 8px"><div class="ct"><span class="nm">${head}</span></div>${rows}</div>`;
}
/* ---- interactive endpoint->endpoint flow (PHASE C): offline L1-L3 port of trace_full_flow ---- */
function flowBetween(s,d){
  const sv=/^\d+$/.test(s.vlan)?+s.vlan:null, dv=/^\d+$/.test(d.vlan)?+d.vlan:null;
  const F={src:s,dst:d,reachable:false,verdict:"",reason:"",hops:[],pathHosts:new Set([s.host,d.host]),linkIdxs:new Set(),spofs:[],gateways:[],aclFlags:[],aclVerdicts:[]};
  const hop=(layer,text,spof)=>F.hops.push({layer,text,spof:!!spof});
  if(sv==null||dv==null){F.verdict="UNKNOWN"; F.reason="Source or destination VLAN is unknown — cannot trace."; hop("—",F.reason,false); return F;}
  hop("L1",`Endpoint ${s.ip||s.mac} on ${s.host} · ${s.port} (access, VLAN ${sv})`,false);
  const seg=(vid,a2,b2)=>{ if(a2===b2)return true; const p=_bfsPath(MODEL,vid,a2,b2); if(p===null)return null;
    for(const h of p)F.pathHosts.add(h);
    for(let i=0;i+1<p.length;i++){const li=_edgeBetween(MODEL,vid,p[i],p[i+1],false); const L=li>=0?MODEL.links[li]:null; if(li>=0)F.linkIdxs.add(li);
      const sf=!!(L&&!L.portChannel);
      hop("L2",`${p[i]} → ${p[i+1]} · trunk (VLAN ${vid})${sf?"  — single-fiber uplink (SPOF)":""}`,sf);
      if(sf)F.spofs.push(`uplink ${p[i]}↔${p[i+1]}`);} return true; };
  if(sv===dv){
    if(seg(sv,s.host,d.host)===null){F.verdict="NOT REACHABLE"; F.reason=`VLAN ${sv} is partitioned between ${s.host} and ${d.host} — no STP-forwarding path.`; hop("L2",F.reason,true); return F;}
    hop("L1",`${d.host} · ${d.port} (access, VLAN ${dv}) → endpoint ${d.ip||d.mac}`,false);
    F.reachable=true; F.verdict="REACHABLE — L2 (same subnet)"; return F;
  }
  const sgwAll=MODEL.gateways.get(sv)||new Set(), dgwAll=MODEL.gateways.get(dv)||new Set();
  if(!sgwAll.size){F.verdict="NOT REACHABLE"; F.reason=`VLAN ${sv} has no gateway (SVI) — the source can't leave its subnet.`; hop("L3",F.reason,true); return F;}
  if(!dgwAll.size){F.verdict="NOT REACHABLE"; F.reason=`VLAN ${dv} has no gateway (SVI) — no inter-subnet routing target.`; hop("L3",F.reason,true); return F;}
  const sgw=[...sgwAll].find(g=>g===s.host||_bfsPath(MODEL,sv,s.host,g)!==null);
  if(!sgw){F.verdict="NOT REACHABLE"; F.reason=`No STP-forwarding path from ${s.host} to a VLAN ${sv} gateway.`; hop("L2",F.reason,true); return F;}
  const dgw=[...dgwAll].find(g=>g===d.host||_bfsPath(MODEL,dv,g,d.host)!==null);
  if(!dgw){F.verdict="NOT REACHABLE"; F.reason=`No STP-forwarding path from a VLAN ${dv} gateway to ${d.host}.`; hop("L2",F.reason,true); return F;}
  seg(sv,s.host,sgw);
  const single=sgwAll.size<2;
  hop("L3",`${sgw} routes VLAN ${sv} → VLAN ${dv} (inter-subnet gateway)${single?"  — single gateway, no FHRP peer (SPOF)":""}`,single);
  if(single)F.spofs.push(`single gateway VLAN ${sv} (${sgw})`);
  F.gateways=[sgw,dgw]; F.pathHosts.add(sgw); F.pathHosts.add(dgw);
  {const ai=gwAcl(sgw,sv); if(ai&&ai.in)F.aclFlags.push({host:sgw,vid:sv,dir:"in",name:ai.in});    // egress SVI of the source subnet
   const ao=gwAcl(dgw,dv); if(ao&&ao.out)F.aclFlags.push({host:dgw,vid:dv,dir:"out",name:ao.out});}  // ingress SVI of the dest subnet
  if(s.ip&&d.ip&&F.aclFlags.length){                                  // G2: evaluate those ACLs against the chosen 5-tuple
    const flow={src:s.ip,dst:d.ip,proto:FLOW_PROTO,dport:(FLOW_PROTO==="tcp"||FLOW_PROTO==="udp")?FLOW_DPORT:null};
    F.aclVerdicts=F.aclFlags.map(a=>{const rules=aclRules(a.host,a.name);
      const v=rules?evalAcl(rules,flow,a.host):{action:"indeterminate",rule:null,idx:-1,nobody:true};
      return Object.assign({},a,{verdict:v.action,rule:v.rule,idx:v.idx,implicit:v.implicit,nobody:v.nobody});});}
  seg(dv,dgw,d.host);
  hop("L1",`${d.host} · ${d.port} (access, VLAN ${dv}) → endpoint ${d.ip||d.mac}`,false);
  F.reachable=true; F.verdict="REACHABLE — L3 (routed via gateway)";
  return F;
}


/* ---- HEALTH (with honest de-duplication of the scoring) ---- */
function dedupeDeductions(deds){
  // collapse repeated identical finding families; surface the dominant driver.
  const fam=new Map();
  (deds||[]).forEach(d=>{const m=String(d).match(/^(.*?)\s*\(([-+]?\d+)\)\s*$/);
    let label=m?m[1].trim():String(d).trim(); let pts=m?+m[2]:0;
    // normalize "@ GiX/Y" specifics into one family
    label=label.replace(/@\s*\S+/,"@ <port>");
    if(!fam.has(label))fam.set(label,{count:0,total:0});
    const f=fam.get(label); f.count++; f.total+=pts;});
  return [...fam.entries()].map(([label,v])=>({label,count:v.count,total:v.total}))
    .sort((a,b)=>a.total-b.total);
}
function drawHealth(){
  const hs=healthList(); const mr=(SNAP&&SNAP.migration_readiness)||[];
  if(!hs.length){return `<div class="drawer-head"><div class="eyebrow">Health</div><div class="title">Health & readiness</div></div>
    <div class="empty"><div class="big">✚</div><p>No <b>health_scores</b> in this snapshot (pre-V3.23).</p></div>`;}
  // selected switch detail
  if(SEL){const r=hs.find(x=>x.switch===SEL);
    if(r){const tok=r.band?healthBandToken(r.band):scoreToken(r.score);
      const fams=dedupeDeductions(r.deductions);
      const driver=fams[0];
      let famRows=fams.map(f=>`<div class="kv"><span class="k">${esc(f.label)}${f.count>1?` <span class="pill pl-neutral">×${f.count}</span>`:""}</span><span class="v" style="color:var(--crit)">${f.total}</span></div>`).join("");
      const myChains=CHAINS.filter(c=>c.switch===SEL);
      return `<div class="drawer-head"><div class="eyebrow">Switch health</div>
        <div class="title"><span class="mono">${esc(shortName(SEL))}</span></div></div>
        <div class="sec"><div class="headline">
          <div class="stat ${tok}"><div class="v">${r.score}</div><div class="k">${esc(r.band||"score")}</div></div>
          <div class="stat"><div class="v" style="font-size:15px;padding:6px 0">${fams.length}</div><div class="k">issue types</div></div>
          <div class="stat"><div class="v" style="font-size:15px;padding:6px 0">${(r.deductions||[]).length}</div><div class="k">raw findings</div></div>
        </div>
        ${driver&&driver.count>1?`<div class="card crit" style="margin-top:11px"><div class="ln"><b>Dominant driver:</b> “${esc(driver.label)}” is counted <b>×${driver.count}</b> (${driver.total} pts). One repeated finding is doing most of the damage to this score — worth confirming it isn't double-counting.</div></div>`:""}
        </div>
        <div class="sec"><h3>Deductions, de-duplicated</h3>${famRows}</div>
        ${myChains.length?`<div class="sec"><h3>Real SPOFs on this switch <span class="ct">${myChains.length}</span></h3>${chainCards(myChains)}</div>`:`<div class="sec"><p class="faint">No structural SPOFs traced to this switch — its low score is driven by the deductions above, not by topology fragility.</p></div>`}`;
    }}
  // overview
  const n=hs.length, avg=Math.round(hs.reduce((s,r)=>s+r.score,0)/Math.max(1,n));
  const bands={ok:0,watch:0,risk:0,crit:0};
  hs.forEach(r=>{const t=r.band?healthBandToken(r.band):scoreToken(r.score);if(bands[t]!=null)bands[t]++;});
  const sorted=hs.slice().sort((a,b)=>a.score-b.score);
  let rows=sorted.map(r=>{const t=r.band?healthBandToken(r.band):scoreToken(r.score);
    return `<tr class="click" data-jump="${esc(r.switch)}"><td class="mono">${esc(shortName(r.switch))}</td>
      <td style="width:90px"><div class="bar"><i style="width:${r.score}%;background:var(--${t})"></i></div></td>
      <td style="text-align:right;font-weight:700;color:var(--${t})">${r.score}</td></tr>`;}).join("");
  let mrCards="";mr.forEach(g=>{const tok=g.readiness==="READY"?"ok":g.readiness==="CAUTION"?"watch":"crit";
    const fails=(g.checks||[]).filter(c=>c.status==="fail"), warns=(g.checks||[]).filter(c=>c.status==="warn"), pass=(g.checks||[]).filter(c=>c.status==="pass");
    let checks=[...fails,...warns,...pass].map(c=>{const ct=c.status==="fail"?"crit":c.status==="warn"?"watch":"ok";
      return `<div class="checkrow"><span class="dot" style="background:var(--${ct})"></span>
        <div><div class="nm">${esc(c.check)}</div><div class="nt">${esc(c.note||"")}</div></div></div>`;}).join("");
    mrCards+=`<div class="sec"><h3>${esc(g.group)} <span class="badge b-${tok}">${esc(g.readiness)}</span></h3>
      <div class="sub" style="margin-bottom:8px">${g.switches.length} switches · ${g.endpoints} endpoints · <b style="color:var(--crit)">${g.n_fail} fail</b> · <b style="color:var(--watch)">${g.n_warn} warn</b></div>
      ${checks}</div>`;});
  // is the scoring crying wolf?
  const allBad=(bands.crit+bands.risk)===n && n>2;
  return `<div class="drawer-head"><div class="eyebrow">Fleet health</div><div class="title">${avg}<span class="sub" style="font-size:13px;font-weight:400"> / 100 avg</span></div></div>
    <div class="sec"><div class="headline">
      <div class="stat ok"><div class="v">${bands.ok}</div><div class="k">good</div></div>
      <div class="stat risk"><div class="v">${bands.watch+bands.risk}</div><div class="k">fair/poor</div></div>
      <div class="stat crit"><div class="v">${bands.crit}</div><div class="k">critical</div></div>
    </div>
    ${allBad?`<div class="card crit" style="margin-top:11px"><div class="ln"><b>Heads-up:</b> every switch lands in poor/critical. When the whole fleet is red, the scoring is usually mis-calibrated (one finding counted many times) rather than the network being uniformly broken. Click a switch to see its <b>dominant driver</b> — then trust the <b>real SPOF list</b> below for what to actually fix first.</div></div>`:""}
    </div>
    <div class="sec"><h3>Switches by score <span class="ct">${n}</span></h3>
      <table><thead><tr><th>Switch</th><th>Score</th><th style="text-align:right">/100</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${mrCards}
    ${CHAINS.length?`<div class="sec"><h3>Fix-this-first (real SPOFs) <span class="ct">${CHAINS.length}</span></h3>
      <p class="sub" style="margin:0 0 10px">Structural single-points-of-failure, de-duplicated and severity-ranked — the genuine migration blockers, independent of the noisy per-port score.</p>
      ${chainCards(CHAINS,6)}</div>`:""}`;
}

document.getElementById("stage").addEventListener("wheel",e=>{e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12; const r=svg().getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const nk=Math.max(0.2,Math.min(view.k*f,3));
  view.tx=mx-(mx-view.tx)*(nk/view.k); view.ty=my-(my-view.ty)*(nk/view.k); view.k=nk; applyTransform();},{passive:false});
