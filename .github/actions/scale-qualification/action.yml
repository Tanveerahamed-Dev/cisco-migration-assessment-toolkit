name: Synthetic 300-device scale qualification
description: Hosted-only real offline engine, AssessHub ingest/API and Scope compile with fixed budgets
inputs:
  expected_source_commit:
    description: Exact selected commit (the scheduled run uses github.sha)
    required: true
runs:
  using: composite
  steps:
    - name: Bind the selected hosted source
      shell: bash
      env:
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.19.0"
    - name: Install the canonical qualification toolchain
      shell: bash
      run: |
        python -m pip install -r requirements-dev.txt
        npm ci --ignore-scripts --prefix atlas-scope
    - name: Exercise privacy census and qualification failure controls
      shell: bash
      run: python -m pytest -q tests/test_client_artifact_census.py .github/scripts/test_qualify_scale.py
    - name: Qualify the real synthetic pipeline
      shell: bash
      env:
        TZ: UTC
        PYTHONHASHSEED: "0"
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONNOUSERSITE: "1"
      run: python -B .github/scripts/qualify_scale.py --work "$RUNNER_TEMP/scale-work" --report-dir "$RUNNER_TEMP/scale-report"
    - name: Preserve qualification report and failure evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scale-qualification-300-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/scale-report/
        if-no-files-found: error
        retention-days: 30
