version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /webapp/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    # Majors are deliberate migrations here, not routine bumps: PR #513 grouped React 18->19,
    # react-router 6->7, TypeScript 5->7, Vite 6->8, and jsdom 29->30 into one lockfile-only PR
    # with no code changes, which cannot work. The completed 2026-08 platform migration established
    # React 19.2.8, React Router 8.3.0, Vite 8.2.1, and plugin-react 6.0.5 as the new baseline.
    # Keep future frontend majors as planned, independently verified migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2026-10-08 owner deferral after #609 superseded grouped proposal #593.
      # Review r186 rendering and Playwright 1.63 browser/visual-baseline changes separately.
      # Keep these specific lines deferred; other maintenance updates remain eligible.
      - dependency-name: "three"
        versions: ["0.186.x"]
      - dependency-name: "@types/three"
        versions: ["0.186.x"]
      - dependency-name: "@playwright/test"
        versions: ["1.63.x"]
      # Defer only Vite 8.3.x pending separate review; later lines remain eligible.
      - dependency-name: "vite"
        versions: ["8.3.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
