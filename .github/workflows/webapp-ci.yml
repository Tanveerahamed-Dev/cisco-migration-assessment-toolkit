name: webapp-ci

on:
  push:
    branches: [main]
    paths: ["webapp/**", "atlas-scope/**", ".design-sync/**", "cisco_toolkit/**", "reference-data/official-sources/**", "COLLECT_PARSE_V3_23_0.py", "conftest.py", "requirements.txt", "requirements-dev.txt", "pyproject.toml", "setup.py", "setup.cfg", "MANIFEST.in", "README.md", "LICENSE", ".gitattributes", "pytest.ini", "tests/golden/**", "tests/synthetic_fixtures.py", "tests/pytest_invocation_reader.py", ".github/workflows/webapp-ci.yml", ".github/scripts/classify_webapp_ci_scope.py", ".github/scripts/frontend_build_handoff.py", ".github/frontend-dependency-plan.json", ".github/scripts/frontend_dependency_prepare.mjs", ".github/scripts/frontend_dependency_prepare.test.mjs", ".github/scripts/frontend_artifact_receive.py", ".github/scripts/frontend_candidate_admit.mjs", ".github/scripts/test_frontend_artifact_receive.py", ".github/scripts/observe_vite_distribution.py", ".github/scripts/test_observe_vite_distribution.py", ".github/scripts/frontend_candidate_materials.py", ".github/scripts/test_frontend_candidate_materials.py", ".github/scripts/observe_jsonschema_rs_wheel.py", "tests/test_jsonschema_rs_observation.py", "master-reference/release/pipeline.py", "portable/release_contract.py", "portable/atlas_bundle.py", "portable/windows-x64-requirements.lock", "portable/third-party-license-fallbacks.json", "portable/third-party-licenses/jsonschema-rs-LICENSE", "tests/test_webapp_ci_scope.py", "tests/test_frontend_artifact_workflow_contract.py", ".github/scripts/verify_repository_privacy.py"]
  # Required checks from a workflow skipped by a top-level path filter remain Pending forever.
  # Start every PR, then skip individual jobs only after the fail-closed classifier below succeeds.
  # `edited` is required because retargeting a PR changes its three-dot base
  # without changing the head SHA; stale skipped-success conclusions are unsafe.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      prepare_frontend_dependencies:
        description: Resolve the reviewed dependency plan in scratch for review only
        required: false
        default: false
        type: boolean
      receive_frontend_artifact:
        description: Receive one exact hosted candidate or dist as review input only
        required: false
        default: false
        type: boolean
      frontend_artifact_selection:
        description: Closed finite source run attempt job artifact and tool selection JSON
        required: false
        default: ""
        type: string
      observe_vite_distribution:
        description: Inspect the selected Vite 8.2.4 distribution as data only
        required: false
        default: false
        type: boolean
      vite_distribution_integrity:
        description: Exact SHA-512 SRI from the independently admitted candidate
        required: false
        default: ""
        type: string
      refresh_visual_baselines:
        description: Capture reviewed-candidate pixels from the Windows 2025 oracle
        required: false
        default: false
        type: boolean
      observe_jsonschema_rs:
        description: Inspect the selected native Windows wheel as data only
        required: false
        default: false
        type: boolean
      jsonschema_rs_source_commit:
        description: Exact full source commit for the native wheel observation
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull-request code is isolated on GitHub-hosted runners. Action revisions are immutable,
# while the comments retain the human-readable upstream release that each commit represents.
jobs:
  scope:
    name: Webapp CI change scope
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests use a three-dot base/head diff; both commits and their merge base must exist.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate exclusive manual operations and bound data inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WEBAPP_MANUAL_PREPARE_FRONTEND_DEPENDENCIES: ${{ inputs.prepare_frontend_dependencies }}
          WEBAPP_MANUAL_RECEIVE_FRONTEND_ARTIFACT: ${{ inputs.receive_frontend_artifact }}
          WEBAPP_MANUAL_OBSERVE_VITE_DISTRIBUTION: ${{ inputs.observe_vite_distribution }}
          WEBAPP_MANUAL_REFRESH_VISUAL_BASELINES: ${{ inputs.refresh_visual_baselines }}
          WEBAPP_MANUAL_FRONTEND_ARTIFACT_SELECTION: ${{ inputs.frontend_artifact_selection }}
          WEBAPP_MANUAL_VITE_DISTRIBUTION_INTEGRITY: ${{ inputs.vite_distribution_integrity }}
          WEBAPP_MANUAL_OBSERVE_JSONSCHEMA_RS: ${{ inputs.observe_jsonschema_rs }}
          WEBAPP_MANUAL_JSONSCHEMA_RS_SOURCE_COMMIT: ${{ inputs.jsonschema_rs_source_commit }}
        run: python -I -B .github/scripts/classify_webapp_ci_scope.py --validate-manual-operations
      - name: Classify paths that can affect webapp CI
        id: classify
        shell: bash
        env:
          WEBAPP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WEBAPP_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Never let pull-request code classify itself as irrelevant. Execute
            # the base commit's reviewed policy; on the one-time bootstrap where
            # the base has no classifier yet, conservatively run every job.
            git cat-file -e "${WEBAPP_CI_BASE_SHA}^{commit}"
            git cat-file -e "${WEBAPP_CI_HEAD_SHA}^{commit}"
            classifier="$RUNNER_TEMP/classify_webapp_ci_scope.py"
            if git cat-file -e "${WEBAPP_CI_BASE_SHA}:.github/scripts/classify_webapp_ci_scope.py" 2>/dev/null; then
              git show "${WEBAPP_CI_BASE_SHA}:.github/scripts/classify_webapp_ci_scope.py" > "$classifier"
              python "$classifier"
            else
              echo "relevant=true" >> "$GITHUB_OUTPUT"
            fi
          else
            python .github/scripts/classify_webapp_ci_scope.py
          fi
      - name: Validate the classifier contract
        shell: bash
        env:
          RELEVANT: ${{ steps.classify.outputs.relevant }}
        run: |
          case "$RELEVANT" in
            true|false) ;;
            *) echo "scope classifier emitted neither true nor false" >&2; exit 1 ;;
          esac

  backend:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    name: Backend e2e tests
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed when scope classification did not succeed
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install complete application and test dependencies
        run: python -m pip install -e ".[dev]"
      # The /scope pins in webapp/tests/test_scope_mount.py run the REAL Atlas Scope compiler and bundler.
      # Without node and atlas-scope's locked dependencies they skip; with ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN=1
      # a missing prerequisite fails the leg instead, so it cannot report green on pins it never executed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: atlas-scope/package-lock.json
      - name: Install Atlas Scope's locked toolchain
        working-directory: atlas-scope
        run: npm ci
      # The hub build is what AssessHub serves at /scope by default (app._REPO_ATLAS_SCOPE_DIST ->
      # atlas-scope/dist-hub). Building it here makes test_scope_mount's real-artifact pin run instead
      # of skip (ATLAS_SCOPE_REQUIRE_HUB_BUILD=1 below): the repository's own hub build must pass every
      # /scope refusal and be linked.
      - name: Build Atlas Scope's hub build (the /scope artifact)
        working-directory: atlas-scope
        run: npm run build:hub
      # test_scope_mount's markup oracle loads every generated /scope document in real Chromium
      # (atlas-scope's own Playwright) and requires AssessHub's verdict to hold in the browser; with
      # ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE=1 a missing browser fails the leg instead of skipping.
      - name: Install Atlas Scope's Playwright Chromium (the /scope markup oracle)
        working-directory: atlas-scope
        run: npx playwright install --with-deps chromium
      - name: Backend tests
        env:
          ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
          ATLAS_SCOPE_REQUIRE_HUB_BUILD: "1"
          ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "1"
        run: python -m pytest webapp/tests -q

  frontend:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    name: Frontend test + type-check + build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - name: Fail closed when scope classification did not succeed
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies for the live API schema
        working-directory: .
        run: python -m pip install -e ".[dev]"
      - name: Export the live backend contract offline
        working-directory: .
        run: python -m webapp.backend.export_ui_projection_openapi --output webapp/frontend/.generated/openapi.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm run verify:node
      - name: Test hosted dependency preparation refusals
        working-directory: .
        run: node --test .github/scripts/frontend_dependency_prepare.test.mjs
      - name: Test finite frontend artifact receipt refusals
        working-directory: .
        run: python -I -B -m unittest discover -s .github/scripts -p test_frontend_artifact_receive.py
      - name: Test fixed Vite distribution observation refusals
        working-directory: .
        run: python -I -B -m unittest discover -s .github/scripts -p test_observe_vite_distribution.py
      - name: Test selected native wheel observation refusals
        working-directory: .
        run: python -I -B -m unittest discover -s tests -p test_jsonschema_rs_observation.py
      - name: Prepare the reviewed dependency candidate without changing checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_frontend_dependencies }}
        working-directory: .
        run: node .github/scripts/frontend_dependency_prepare.mjs
      - name: Preserve dependency preparation candidates and failures
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.prepare_frontend_dependencies }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dependency-preparation/
          if-no-files-found: error
          retention-days: 14
      - name: Receive finite reviewed frontend edit data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.receive_frontend_artifact }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_ARTIFACT_SELECTION: ${{ inputs.frontend_artifact_selection }}
        run: python -I -B .github/scripts/frontend_artifact_receive.py
      - name: Preserve frontend receiver results and failures
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.receive_frontend_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-artifact-receive-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-artifact-receive/
          if-no-files-found: error
          retention-days: 14
      - name: Observe the independently selected Vite distribution bytes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_vite_distribution }}
        working-directory: .
        env:
          VITE_SELECTED_INTEGRITY: ${{ inputs.vite_distribution_integrity }}
        run: python -I -B .github/scripts/observe_vite_distribution.py --integrity "$VITE_SELECTED_INTEGRITY"
      - name: Preserve Vite distribution observation and failures
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.observe_vite_distribution }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vite-distribution-observation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vite-distribution-observation/
          if-no-files-found: error
          retention-days: 14
      - name: Observe the selected native Windows wheel as data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_jsonschema_rs }}
        working-directory: .
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.jsonschema_rs_source_commit }}
        run: python -I -B .github/scripts/observe_jsonschema_rs_wheel.py
      - name: Preserve native wheel observations and failures
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.observe_jsonschema_rs }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jsonschema-rs-observation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jsonschema-rs-observation/
          if-no-files-found: error
          retention-days: 14
      - run: npm ci
      - name: Test candidate material observation contracts
        working-directory: .
        run: python -I -B -m unittest discover -s .github/scripts -p test_frontend_candidate_materials.py
      - name: Check installed Vite bytes and observe the canonical frontend inventory
        working-directory: .
        run: python -I -B .github/scripts/frontend_candidate_materials.py
      - name: Preserve candidate material observations and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-candidate-materials-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-candidate-materials/
          if-no-files-found: error
          retention-days: 14
      - run: npm run api:check
      - run: npm test
      - name: Bind immutable frontend inputs before the SPA build
        working-directory: .
        run: python .github/scripts/frontend_build_handoff.py before --output "${{ runner.temp }}/frontend-dist-handoff"
      - run: npm run build
      - name: Verify privacy and capture the generated SPA for review
        working-directory: .
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -I -B .github/scripts/verify_repository_privacy.py --root .
          python .github/scripts/frontend_build_handoff.py after --output "${{ runner.temp }}/frontend-dist-handoff"
      - name: Preserve the source-bound SPA build handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dist-handoff/
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    name: Frontend E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - name: Fail closed when scope classification did not succeed
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm run verify:node
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve frontend E2E results and partial evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: webapp/frontend/test-results
          if-no-files-found: error
          retention-days: 14

  visual:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    name: Design visual regression · Windows 2025 x64 Chromium
    runs-on: windows-2025
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - name: Fail closed when scope classification did not succeed
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm run verify:node
      - id: install
        run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual:types
      - name: Compare reviewed visual baselines
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_visual_baselines }}
        run: npm run test:visual
      - name: Capture candidate visual baselines for human review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines }}
        env:
          VISUAL_ORACLE_CAPTURE: "1"
        run: npm run test:visual:update
      - name: Validate the freshly captured baseline set
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines }}
        run: npm run test:visual
      - name: Record visual-oracle versions
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/visual | Out-Null
          $nodeVersion = node --version
          $playwrightVersion = & .\node_modules\.bin\playwright.cmd --version
          $chromiumVersion = node -e 'const {chromium}=require("playwright"); (async()=>{const b=await chromium.launch(); console.log(b.version()); await b.close()})().catch(e=>{console.error(e); process.exit(1)})'
          $details = @(
            "ImageOS=$env:ImageOS"
            "ImageVersion=$env:ImageVersion"
            "RunnerArch=$env:RUNNER_ARCH"
            "Node=$nodeVersion"
            "Playwright=$playwrightVersion"
            "Chromium=$chromiumVersion"
          )
          $details | Set-Content -Encoding utf8 test-results/visual/oracle.txt
          $details | ForEach-Object { "- $_" } | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Upload candidate visual baselines
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-visual-baselines-windows-2025-x64
          path: webapp/frontend/visual-e2e/__screenshots__/windows-2025-x64
          if-no-files-found: error
          retention-days: 14
      - name: Upload visual diffs
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || !inputs.refresh_visual_baselines) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-visual-diffs-windows-2025-x64
          path: |
            webapp/frontend/test-results/visual
            webapp/frontend/playwright-report/visual
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Webapp CI gate
    needs: [scope, backend, frontend, e2e, visual]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete classified job set
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "scope classification did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi
          case "$RELEVANT" in
            true) expected="success" ;;
            false) expected="skipped" ;;
            *) echo "scope classifier emitted neither true nor false" >&2; exit 1 ;;
          esac
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$E2E_RESULT" "$VISUAL_RESULT"; do
            if [[ "$result" != "$expected" ]]; then
              echo "classified webapp job concluded $result; expected $expected" >&2
              exit 1
            fi
          done
