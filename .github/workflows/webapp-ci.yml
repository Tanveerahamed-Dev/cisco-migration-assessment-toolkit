name: webapp-ci

# Gives the AssessHub web platform (webapp/) the same CI treatment the engine gets: the backend's
# end-to-end test suite runs against an isolated temp DB, and the frontend is type-checked (tsc
# strict) + production-built. Both jobs are fully offline — no SSH, no live network. Path-filtered so
# it only runs when the webapp (or the engine it imports) actually changes.

on:
  push:
    branches: [main]
    paths: ["webapp/**", "cisco_toolkit/**", "COLLECT_PARSE_V3_23_0.py", ".github/workflows/webapp-ci.yml"]
  pull_request:
    paths: ["webapp/**", "cisco_toolkit/**", "COLLECT_PARSE_V3_23_0.py", ".github/workflows/webapp-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

# Runner fleet toggle (same contract as ci.yml, PR #325): the repo variable CI_RUNNER reroutes both
# jobs to the self-hosted pool when set ("self-hosted" = the registered Windows runners on the dev
# box, $0 metered minutes) and falls back to GitHub-hosted runners when unset/empty. Job names are
# untouched. The shared runner toolcache ships Python-only; the frontend job's setup-node downloads
# node 20 and self-seeds the toolcache on its first self-hosted run.

jobs:
  backend:
    name: Backend e2e tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Engine runtime deps (the web layer imports cisco_toolkit) + pytest (requirements-dev) + the
      # web layer's own deps (fastapi/uvicorn/multipart/httpx).
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r webapp/requirements.txt
      - name: Backend tests (FastAPI TestClient, isolated temp DB)
        run: python -m pytest webapp/tests -q

  frontend:
    name: Frontend test + type-check + build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      # Vitest (jsdom) — jsdom-safe unit tests: pure colour tokens + the ErrorBoundary state machine.
      # `vitest run` exits non-zero on failure, so a broken test fails CI (fail-fast, before the build).
      - run: npm test
      # `npm run build` is `tsc -p tsconfig.json && vite build`, so a type error or a broken build fails CI.
      - run: npm run build

  e2e:
    name: Frontend E2E (Playwright, real browser + WebGL)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      # Chromium for the real-browser E2E (the WebGL 3D-render test jsdom can't reach). Idempotent —
      # a fast no-op on the self-hosted runner where the browser is already cached.
      - run: npx playwright install --with-deps chromium
      # `playwright test` builds (tsc + vite), serves the build, and drives Chromium (see playwright.config.ts).
      - run: npm run test:e2e
