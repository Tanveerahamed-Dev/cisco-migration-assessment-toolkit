name: engine-output-handoff

# Manual, review-only regeneration of the engine's tracked outputs (tests/golden/snapshot.json,
# tests/golden/sheet_schema.json and webapp/sample_data/sample_fleet.snapshot.json) for one exact
# dispatched commit. It runs the repository's own regeneration commands and nothing else, refuses
# any produced set other than that closed set, and uploads one source-bound artifact. It never
# writes to the repository. Mandatory source/policy refutation controls run before the source is
# bound. The hosted, dispatch-only `.github/workflows/engine-output-receipt.yml`
# admits that artifact as review data; a person applies the admitted bytes with Git, reviews and
# commits them, the receipt's `verify_import` mode binds that commit to those bytes, and the ordinary
# hosted gates on that commit decide. See docs/engine-output-handoff.md.
#
# Dispatch only. A pull request or push never starts it, so it can neither re-bless a golden behind
# a review nor run on code that has not been deliberately selected.
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Full 40-character commit SHA that the dispatched ref must point at
        required: true
        type: string
      allow_golden_shrink:
        description: Explicitly allow the golden harness to remove contract surface (ALLOW_GOLDEN_SHRINK=1)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: engine-output-handoff-${{ github.ref }}
  cancel-in-progress: false

# Action revisions are immutable, while the comments retain the human-readable upstream release
# that each commit represents.
jobs:
  regenerate:
    name: Regenerate engine outputs for review (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      TZ: UTC
    steps:
      - name: Require the dispatched commit to be the expected source
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_source_commit must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$EXPECTED_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "the dispatched ref points at $GITHUB_SHA, not the expected $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upgrade the installer
        run: python -m pip install --upgrade pip
      - name: Install complete runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Refute source and policy admission defects before generation
        run: python -m pytest -p no:cacheprovider tests/test_engine_output_handoff.py tests/test_engine_output_handoff_workflow_contract.py
      - name: Bind the exact source before regeneration
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: python -I -B .github/scripts/engine_output_handoff.py before --state "$RUNNER_TEMP/engine-output-state"
      # The golden harness's own deliberate re-baseline path; its shrink guard still refuses a removed
      # section, sheet or header unless the explicit dispatch input allows it.
      - name: Regenerate the golden snapshot and workbook sheet schema
        env:
          UPDATE_GOLDEN: "1"
          ALLOW_GOLDEN_SHRINK: ${{ inputs.allow_golden_shrink && '1' || '0' }}
        run: python -m pytest -p no:cacheprovider tests/test_pipeline_golden.py::test_snapshot_matches_golden tests/test_pipeline_golden.py::test_excel_sheet_schema_matches_golden
      - name: Regenerate the engine-built sample fleet
        run: python webapp/sample_data/build_sample.py
      - name: Verify privacy and capture the closed output set for review
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          ALLOW_GOLDEN_SHRINK_INPUT: ${{ inputs.allow_golden_shrink }}
        run: |
          python -I -B .github/scripts/verify_repository_privacy.py --root .
          python -I -B .github/scripts/engine_output_handoff.py after --state "$RUNNER_TEMP/engine-output-state" --output "$RUNNER_TEMP/engine-output-handoff"
      # Uploaded only on success: a failed or partial regeneration never leaves an importable artifact.
      - name: Preserve the source-bound engine output handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-output-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-output-handoff/
          if-no-files-found: error
          retention-days: 14
