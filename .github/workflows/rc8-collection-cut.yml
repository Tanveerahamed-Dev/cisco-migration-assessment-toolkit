name: RC8 collection source comparison
on:
  push:
    branches: [codex/rc8-order-diagnostic]
  workflow_dispatch:
    inputs:
      cases_json:
        description: 'JSON array of allowlisted collection cases; individual exclusions require prior control reconciliation'
        type: string
        required: true
        default: '["pr-full", "main-full", "pr-without-six"]'
permissions:
  contents: read
jobs:
  collection-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cases_json || '["pr-full", "main-full", "pr-without-six"]') }}
    env:
      ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
      ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
      SOURCE_COMMIT: ${{ matrix.case == 'main-full' && 'b300a57b991746a9c284d513a365b330476480b4' || '8c4b87d8bc149a30fcd05f5efcd123856a2778e6' }}
    steps:
      - name: Start unchanged bounded diagnostic clock
        shell: bash
        run: echo "ATLAS_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install graphifyy==0.9.51
        working-directory: subject
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: subject/atlas-scope
      - name: Complete budget module after declared default collection
        env:
          COLLECTION_CASE: ${{ matrix.case }}
        run: >-
          python control/.github/diagnostics/rc8_order_probe.py --subject subject
          --output "$RUNNER_TEMP/collection-cut" --source "$SOURCE_COMMIT"
          --baseline c2de3bf8005912c29c052dcedaa71b0acc3ca9f0
          --mode collection-cut --collection-case "$COLLECTION_CASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rc8-collection-cut-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/collection-cut
          if-no-files-found: error