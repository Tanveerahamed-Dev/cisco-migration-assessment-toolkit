name: main-selfhosted

# Post-merge verification on the self-hosted Windows fleet — zero hosted-runner minutes.
#
# Deliberately NOT triggered by pull_request: the repository's standing security rule
# (see the ci.yml header) is that PR code executes only on GitHub-hosted, ephemeral
# runners, never on a persistent local machine. This workflow executes only after the
# subject is present on main. Ordinary review/merge and explicit admin exceptions are
# separately governed; this post-merge verifier does not prove review or approval.
# This job supplements the hosted matrix (it does not replace it and
# is not a required protection context); it exists so main keeps continuous verification
# when hosted minutes are exhausted.
#
# Runner facts this workflow is written around: the fleet is Windows (PowerShell steps,
# no bashisms, no && chains), and actions/setup-python cannot install interpreters on it
# — the machine's own `py -3.12` launcher is used via an isolated per-run venv so the
# runner host's Python environment is never mutated.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mainsh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Main suite · py3.12 · self-hosted-windows
    runs-on: [self-hosted, Windows, X64]
    # Exact-main runs 33274394182 and 33278292400 both reached 94% before cancellation
    # at the 90-minute job ceiling; the first explicitly logged KeyboardInterrupt.
    # Keep the complete gate intact and give the measured Windows runtime bounded
    # headroom. Completion still requires a successful exact-main post-merge run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The venv lives in RUNNER_TEMP, never inside the checkout: the privacy gate scans the
      # working tree, and a venv inside it fails the gate on its own scaffolding (churning
      # Scripts/*.exe stubs, and pyvenv.cfg embeds the machine's user-name path, which the
      # gate correctly treats as a marker). Proven by this workflow's maiden run.
      - name: Create isolated venv
        run: py -3.12 -m venv "$env:RUNNER_TEMP\ci-venv"
      - name: Upgrade pip
        run: '& "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m pip install --upgrade pip'
      - name: Install complete runtime and test dependencies
        run: '& "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m pip install -e ".[dev]"'
      - name: Ruff correctness rules
        run: '& "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m ruff check .'
      - name: Tracked-tree privacy boundary
        run: '& "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" .github/scripts/verify_repository_privacy.py'
      - name: Run the complete default suite
        run: '& "$env:RUNNER_TEMP\ci-venv\Scripts\python.exe" -m pytest'

  frontend:
    name: Frontend suite · self-hosted-windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner is the dev box: node/npm come from the machine (like py -3.12 above), the
      # Playwright browser cache is per-user and shared, and the E2E server port is pinned to a
      # CI-only value so a developer's own preview/E2E session can never collide with a job
      # (playwright.config.ts: E2E_PORT overrides the 41973 default, itself chosen off-default
      # because of exactly this collision class).
      - name: Verify frontend Node contract
        run: npm --prefix webapp/frontend run verify:node
      - name: Install exact frontend dependencies
        run: npm --prefix webapp/frontend ci
      # Exact-main run 33286607459 passed 11 files / 57 tests, then 13 default-pool
      # fork workers timed out before their files could execute. Keep the same tests,
      # isolation, and fail-closed behavior while bounding process fan-out on this
      # persistent host. Vitest applies its worker environment override after CLI/config
      # resolution, so pin both surfaces; do not replace them with retries or filters.
      - name: Frontend unit tests
        env:
          VITEST_MAX_WORKERS: "4"
        run: npm --prefix webapp/frontend test -- --maxWorkers=4
      - name: Production build
        run: npm --prefix webapp/frontend run build
      - name: Ensure Playwright chromium
        run: Set-Location webapp/frontend; npx playwright install chromium
      - name: Frontend E2E (real browser)
        env:
          E2E_PORT: "42973"
        run: Set-Location webapp/frontend; npm run test:e2e
