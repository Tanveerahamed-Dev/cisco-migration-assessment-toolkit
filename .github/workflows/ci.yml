name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      measure_projection_performance:
        description: "Run the optional hosted projection measurement (existing CI jobs still run)"
        type: boolean
        default: false
        required: false
      expected_source_commit:
        description: "Required for measurement: full commit SHA, matching the selected ref"
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.measure_projection_performance && '-projection-performance' || '' }}
  cancel-in-progress: true

# Every third-party action is pinned to an immutable commit. Pull-request code runs only
# on GitHub-hosted, ephemeral runners; repository variables cannot redirect it to a
# persistent machine with local credentials or state.
jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff correctness rules
        run: python -m ruff check .
      - name: Tracked-tree privacy boundary
        run: python .github/scripts/verify_repository_privacy.py

  test:
    # Execute Linux legs on the pinned image; keep the historical protected-check display names.
    name: Tests · py${{ matrix.python-version }} · ${{ matrix.os == 'ubuntu-24.04' && 'ubuntu-latest' || matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The full history: the suite's history-needing tests skip on a depth-1 checkout -- the SSOT
        # renamed-owner citation check (top-level names git once tracked) and the R2 successor and legacy
        # package pins. tests/test_ssot_registry.py guards every workflow leg that collects them.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install complete runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      # Surface exact hosted LF-scope receipts before an expensive full-suite cycle.
      # This remains in the complete suite on every leg; no failed assertion is waived.
      - name: Verify LF byte-custody scope before full tests
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        run: python -m pytest tests/test_transition_schema_assets.py::test_byte_bound_checkout_owners_are_lf_exactly_attributed
      # Run the import-state contract before the expensive suite; the complete default
      # suite still collects these tests again with the subsequent Windows spawn tests.
      - name: Scope handoff import-state contracts
        run: python -m pytest tests/test_scope_compile_handoff.py
      # Fail promptly on receive liveness regressions; the unchanged complete
      # suite below still collects these transport contracts on every platform.
      - name: Debug helper receive deadline contracts
        run: python -m pytest tests/test_transition_runtime_discovery.py -k debug_helper_receive
      - name: Install reviewed Graphify producer for its exact-runtime integration
        if: matrix.python-version == '3.12'
        run: python -m pip install "graphifyy==0.9.51"
      - name: Require the reviewed Graphify version, extractor bytes, and alias topology
        if: matrix.python-version == '3.12'
        run: python -I -B tools/graphify_guarded.py --probe
      # The default suite includes webapp/tests, whose /scope pins run the REAL Atlas Scope compiler and
      # bundler; ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN=1 makes a missing node/npm ci fail those pins, never skip.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: atlas-scope/package-lock.json
      - name: Install Atlas Scope's locked toolchain
        working-directory: atlas-scope
        run: npm ci
      # The /scope markup oracle (webapp/tests/test_scope_mount.py, "the browser is the oracle") needs a
      # real Chromium this matrix does not install. It is required on the legs that install one: webapp-ci's
      # backend leg (webapp/** changes) and atlas-scope-ci (atlas-scope/** changes). Here it is declined
      # EXPLICITLY, so it skips visibly; with the real-toolchain switch alone a missing browser fails.
      - name: Run the complete default suite
        env:
          ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
          ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
        run: python -m pytest
      - name: Reproduce the complete committed sample under UTC
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        env:
          TZ: UTC
        run: python webapp/sample_data/build_sample.py --check

  typecheck:
    name: mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: mypy gated modules
        run: >-
          python -m mypy
          cisco_toolkit/__init__.py cisco_toolkit/cmdio.py cisco_toolkit/eoldb.py
          cisco_toolkit/model.py cisco_toolkit/ouidb.py cisco_toolkit/portdb.py
          cisco_toolkit/protocol_kb.py cisco_toolkit/textutils.py
      - name: mypy full-project report
        continue-on-error: true
        run: python -m mypy cisco_toolkit COLLECT_PARSE_V3_23_0.py

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The full history: the suite's history-needing tests skip on a depth-1 checkout -- the SSOT
        # renamed-owner citation check (top-level names git once tracked) and the R2 successor and legacy
        # package pins. tests/test_ssot_registry.py guards every workflow leg that collects them.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Coverage gate
        run: >-
          python -m pytest
          --cov=cisco_toolkit
          --cov-report=term-missing:skip-covered
          --cov-fail-under=85

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: python -m pip install --upgrade pip
      # Every non-empty declared extra except [build] is installed so the audit below covers it; [build]'s exact
      # set is the shipped Atlas lock, audited on its own further down. [build-system].requires is
      # installed explicitly too: pip's build isolation would otherwise keep it out of the audited
      # environment. The contract test requires these specifiers to equal pyproject.toml's.
      - name: Install audited Python environment
        run: python -m pip install "setuptools==84.0.0" "wheel==0.48.0" -e ".[dev,docx,pptx,mcp,eval]" "pip-audit>=2.9,<3"
      # The audit's subject is the DEPENDENCY CLOSURE, so the unpublishable project itself is
      # uninstalled first. Both flag-level attempts failed, each measured on a real run (2026-08-02):
      #   --strict                  -> "Dependency not found on PyPI: cisco-migration-assessment-
      #                                toolkit" is FATAL (the project is private; PyPI can never
      #                                know it) — the gate could not pass as written.
      #   --strict --skip-editable  -> "distribution marked as editable" is ALSO fatal, because
      #                                --strict's definition is "fail on ANY skip" — the two flags
      #                                compose against each other by design.
      # Uninstalling the project leaves exactly the dependency set in the environment, fully audited
      # under undiluted --strict: no skips, no not-found, and a real CVE in any dependency still
      # fails the job. The project's own code is what every other job tests.
      # This environment no longer suppresses PYSEC-2026-2858 (paramiko 4.0.0 permits SHA-1 in
      # rsakey.py). The suppression existed because netmiko 4.7.0 capped `paramiko<5.0`; netmiko 4.8.0
      # (2026-09-21) lifted that cap, so this floating environment resolves paramiko 5.0.0 (the hosted
      # audit of PR #585 installed it on 2026-10-02), which the advisory does not affect (OSV records
      # 4.0.0 as the last affected version). The flag now applies only to the shipped lock below,
      # which still pins paramiko 4.0.0.
      - name: Audit installed Python dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m pip uninstall --yes cisco-migration-assessment-toolkit
          python -m pip_audit --strict
      # EVERY tracked Python requirements file and pip-compile lock is also audited: by its own step
      # below, or, for a file that only installs this project editable, through the environment
      # above. That environment is one install, not the Master Reference release toolchain, the
      # transition runtime pins or the hash-locked set inside Atlas.exe.
      # Seven high pypdf advisories in the release toolchain were found by Dependabot, not here
      # (2026-10-02). tests/test_python_dependency_audit_contract.py derives the manifests from
      # `git ls-files` and fails when one has no audit step here. A ranged file is resolved into a
      # temporary environment on the day of the run; the hash-locked file is audited exactly as
      # pinned (--disable-pip), because it is the Windows set the release is built from. A resolving
      # audit pre-installs the latest pip, wheel and setuptools in its temporary environment, so a
      # file's pin of one of those is not in that file's report; the contract therefore requires
      # such a pin to equal the version the environment above installs from [build-system].requires.
      # Each Python audit runs unless the workflow is cancelled (`!cancelled()`), so one failing
      # manifest does not hide the other Python verdicts; any failure still fails this required job.
      - name: Audit the Master Reference release toolchain
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict -r master-reference/requirements-release.txt
      - name: Audit the runtime requirements
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict -r requirements.txt
      - name: Audit the webapp requirements
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict -r webapp/requirements.txt
      - name: Audit the transition runtime test pins
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict -r tools/requirements-transition-runtime-test.txt
      # --ignore-vuln PYSEC-2026-2858 is a NAMED suppression on this lock only; the registry with its
      # reason is NAMED_PIP_AUDIT_SUPPRESSIONS in tests/test_python_dependency_audit_contract.py. The
      # shipped lock still pins paramiko 4.0.0 under netmiko 4.7.0; the fix is a re-lock to netmiko
      # 4.8.0 / paramiko 5.0.0, which re-qualifies the portable release contract and is its own
      # change. Severity: CVSS AV:A/AC:H/I:L (adjacent network, high complexity, low integrity).
      - name: Audit the shipped Atlas lock
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict --disable-pip -r portable/windows-x64-requirements.lock --ignore-vuln PYSEC-2026-2858
      # EVERY tracked npm lockfile is audited with the same flags: a required check that audits one
      # hand-picked package leaves the others' production and development graphs unaudited (the
      # atlas-scope/ hub build ships in the Atlas bundle). tests/test_frontend_platform_contract.py
      # derives the tracked lockfiles from `git ls-files` and fails when one has no audit step here.
      - name: Install locked frontend dependencies
        working-directory: webapp/frontend
        run: |
          npm run verify:node
          npm ci --ignore-scripts
      - name: Audit frontend dependencies
        working-directory: webapp/frontend
        env:
          # npm 11 rejects one path being loaded as both user and global
          # configuration. Keep both layers isolated without aliasing them.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-userconfig
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npm-globalconfig
        run: >-
          npm audit --audit-level=high
          --registry=https://registry.npmjs.org/
          --offline=false
          --include=prod --include=dev --include=optional --include=peer
      - name: Install locked Atlas Scope dependencies
        working-directory: atlas-scope
        run: npm ci --ignore-scripts
      - name: Audit Atlas Scope dependencies
        working-directory: atlas-scope
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-userconfig
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npm-globalconfig
        run: >-
          npm audit --audit-level=high
          --registry=https://registry.npmjs.org/
          --offline=false
          --include=prod --include=dev --include=optional --include=peer
      - name: Install locked master reference dependencies
        working-directory: master-reference
        run: npm ci --ignore-scripts
      - name: Audit master reference dependencies
        working-directory: master-reference
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-userconfig
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npm-globalconfig
        run: >-
          npm audit --audit-level=high
          --registry=https://registry.npmjs.org/
          --offline=false
          --include=prod --include=dev --include=optional --include=peer

  package:
    name: Distribution contract
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture the immutable source identity
        id: source
        run: |
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Prove toolchain setup did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Rebuild the bundled AssessHub SPA
        working-directory: webapp/frontend
        run: |
          npm run verify:node
          npm ci
          npm test
          npm run build
      # The separate decision named in the previous revision of this comment has now been TAKEN:
      # `webapp/frontend/dist/` is TRACKED (2026-08-02), pinned `-text` in .gitattributes so the bytes
      # survive round-tripping. That makes this step mean what its name says for the first time — the
      # rebuild is byte-compared against the committed bundle, so a build that does not reproduce it
      # shows up here as a MODIFIED TRACKED FILE and fails.
      #
      # Why it matters: without tracking, `distribution_verify --require-source-binding` exits 3 with
      # "5 shipped archive member(s) are outside the claimed commit" — index.html plus the four
      # content-hashed assets ship in the wheel bound to nothing. Tracking them is what makes the
      # release source-bound.
      #
      # The dist allow-listing is deliberately GONE (tracked paths are not untracked paths, so it is
      # now a no-op that would only mask an unexpected build output). node_modules stays.
      #
      # FIRST RUN IS THE REAL TEST: these bytes were built on Windows and this job rebuilds on
      # ubuntu/node-24.19.0. Two consecutive builds were verified byte-identical on the authoring machine,
      # but CROSS-PLATFORM reproduction — including Vite's content-hashed filenames — is unproven
      # until this step runs. If it fails, the honest reading is that the bundle is not reproducible
      # across platforms, and the fix is a pinned/containerised build, NOT re-adding the allowlist.
      - name: Prove the SPA build reproduced the immutable source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
      - name: Install the exact distribution toolchain
        run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - name: Prove tool installation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
      - name: Build and byte-reproduce exactly one wheel and one source archive
        run: >-
          python tools/build_reproducible_distributions.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --outdir dist
      - name: Prove the archive build did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Validate archive metadata
        run: python -m twine check dist/*
      - name: Prove metadata validation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Verify runtime completeness, metadata, hashes, and privacy boundary
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --require-source-binding
          --json-out dist/dist-verification.json
      - name: Prove distribution verification did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      # From PR #506 (security: protect client evidence and audit release artifacts). This is the one
      # control that branch had and this job did not: it inspects the archives' MEMBER LIST for client
      # evidence and for required assets, which distribution_verify does not do in those terms. Its
      # sibling steps there (install the wheel, smoke the entry point / KB / explorer template) are
      # deliberately NOT merged -- the steps below already do all of that and more, installing with
      # --force-reinstall and running `assesshub --selftest` plus the scoped registry-authority checks.
      # Placed BEFORE the install and the preservation so a client-evidence leak stops the job at the
      # cheapest point rather than after an artifact has been installed and preserved.
      - name: Audit distribution contents (no client evidence / required assets present)
        run: python tools/audit_wheel.py dist
      - name: Prove the content audit did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Install the wheel non-editably
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove wheel installation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Smoke-test installed entry points and authoritative registries
        working-directory: ${{ runner.temp }}
        run: |
          cisco-assess --help
          assesshub --selftest
          # The selftest and this independent release assertion both require the compact Cisco EoL
          # fixture to verify in the installed wheel. Only the much larger IEEE/IANA source corpus
          # may use pack_is_usable's explicitly disclosed cannot-check-here state.
          # Routed through registry_integrity.pack_is_usable — the ONE owner of this question.
          # This line used to carry its own inline conjunction with a comment saying "keep in step
          # with COLLECT_PARSE and serve.py; there are four consumers" — the hand-sync instruction
          # that guarantees drift, and it drifted: when the owner learnt to distinguish
          # CANNOT-CHECK-HERE (wheel installs ship without reference-data/official-sources/**) from
          # CHECKED-AND-FAILED, the three Python consumers followed and THIS copy, living in YAML
          # where a grep for Python callers never looked, kept failing a healthy wheel — the
          # selftest above printed PASS 9/9 and this very next line exited 1 on the same facts
          # (proven on run 30744547871). A duplicated predicate in a workflow file is still a
          # duplicated predicate. Degraded installs are disclosed, not silently passed.
          python -c "import sys; from cisco_toolkit import eoldb, ouidb, portdb, registry_integrity as R; pairs = (('oui', ouidb.registry_health()), ('port', portdb.registry_health()), ('eol', eoldb.registry_health())); bad = [(n, h) for n, h in pairs if not R.pack_is_usable(h)]; [print(f'{n}: usable on bytes + build provenance; retained official sources not present in this install form (repo/sdist only)') for n, h in pairs if h.get('official_sources_available') is False and not bad]; sys.exit('registry pack unusable: %r' % (bad,)) if bad else None"
      - name: Final immutable-source proof before preserving archives
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Reverify the exact archive bytes immediately before preservation
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --require-source-binding
          --expected-json dist/dist-verification.json
      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/dist-verification.json
          if-no-files-found: error
          retention-days: 14

  projection-performance:
    name: Projection HTTP performance · opt-in measurement
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_projection_performance }}
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      PYTHONIOENCODING: utf-8
    steps:
      - name: Initialize external measurement evidence
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proof = Join-Path $env:RUNNER_TEMP "atlas-ui-projection-performance"
          New-Item -ItemType Directory -Path $proof | Out-Null
          [ordered]@{
            schema = "ui_projection_hosted_context/1"
            github_sha = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            workflow = $env:GITHUB_WORKFLOW
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $proof "context.json") -Encoding utf8
          # Configure only this ephemeral measurement runner, before checkout.
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure literal checkout bytes" }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure LF checkout bytes" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
      # This runner executes neither Node builds nor pytest. The unchanged benchmark
      # measures real ASGI responses; these receipts do not replace local failures.
      - name: Bind source, install canonical dependencies, and measure both profiles
        id: measure
        shell: python
        run: |
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          proof = Path(os.environ["RUNNER_TEMP"]) / "atlas-ui-projection-performance"
          report = {"schema": "ui_projection_hosted_measurement/1", "setup": [],
                    "measurements": [], "errors": [], "scope": "hosted runner; local failures remain evidence"}

          def save():
              (proof / "measurement.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

          def identity():
              def git(*args):
                  result = subprocess.run(["git", *args], cwd=root, capture_output=True,
                                          text=True, encoding="utf-8", check=True)
                  return result.stdout.strip()
              return {"commit": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}"),
                      "tracked_status": git("status", "--porcelain=v1", "--untracked-files=no")}

          def capture(name, args, timeout):
              result = {"name": name, "argv": args, "exit_code": None}
              try:
                  with (proof / (name + ".stdout.log")).open("wb") as stdout, \
                       (proof / (name + ".stderr.log")).open("wb") as stderr:
                      result["exit_code"] = subprocess.run(args, cwd=root, stdout=stdout, stderr=stderr,
                                                           timeout=timeout, check=False).returncode
              except (OSError, subprocess.TimeoutExpired) as exc:
                  result["error"] = str(exc)
              return result

          before = None
          try:
              context = json.loads((proof / "context.json").read_text(encoding="utf-8-sig"))
              required = ("github_sha", "repository", "ref", "workflow", "run_id", "run_attempt",
                          "runner_os", "runner_arch", "image_os", "image_version")
              missing = [key for key in required if not context.get(key)]
              if missing:
                  raise RuntimeError("Missing hosted identity fields: " + ", ".join(missing))
              expected = os.environ.get("EXPECTED_SOURCE_COMMIT", "")
              workflow_sha = os.environ.get("GITHUB_SHA", "")
              if not re.fullmatch(r"[0-9a-fA-F]{40}", expected):
                  raise RuntimeError("Measurement requires a nonempty full expected_source_commit SHA")
              if not re.fullmatch(r"[0-9a-fA-F]{40}", workflow_sha):
                  raise RuntimeError("Missing or malformed workflow SHA")
              before = identity()
              report["source_before"] = before
              report["expected_commit"] = expected.lower()
              if before["commit"] != expected.lower() or before["commit"] != workflow_sha.lower():
                  raise RuntimeError("Expected commit, checkout HEAD, and workflow SHA must agree")
              if before["tracked_status"]:
                  raise RuntimeError("Tracked checkout is not clean before setup")
              report["python"] = {"version": platform.python_version(), "executable": sys.executable,
                                  "platform": platform.platform()}
              if sys.version_info[:3] != (3, 12, 10):
                  raise RuntimeError("Measurement requires Python 3.12.10")
              for name, args, timeout in (
                  ("pip-upgrade", [sys.executable, "-m", "pip", "install", "--upgrade", "pip"], 120),
                  ("pip-install", [sys.executable, "-m", "pip", "install", "-r", "requirements-dev.txt"], 600),
                  ("pip-freeze", [sys.executable, "-m", "pip", "freeze", "--all"], 60),
              ):
                  step = capture(name, args, timeout)
                  report["setup"].append(step)
                  save()
                  if step["exit_code"] != 0:
                      raise RuntimeError(name + " failed; see its preserved stdout/stderr")
              if identity() != before:
                  raise RuntimeError("Tracked source changed during dependency setup")
              for name, options in (
                  ("sample-50-and-synthetic-300", ["--limit", "50"]),
                  ("sample-200", ["--sample-only", "--limit", "200"]),
              ):
                  output = proof / (name + ".json")
                  args = [sys.executable, "tests/perf_ui_projection.py", "--all-lists", "--repeats", "5",
                          "--require-sample-warm-ms", "300", "--output", str(output), *options]
                  measurement = capture(name, args, 600)
                  measurement["receipt"] = output.name
                  try:
                      receipt = json.loads(output.read_text(encoding="utf-8"))
                      if receipt["source_commit"] != before["commit"] or receipt["tracked_changes"]:
                          raise RuntimeError("Benchmark receipt does not bind the unchanged expected source")
                      source_map = receipt.get("source_sha256")
                      required_sources = {"tests/perf_ui_projection.py", "tests/test_ui_projection_inventory.py",
                                          "webapp/backend/ui_projection_api.py"}
                      if not isinstance(source_map, dict) or not required_sources.issubset(source_map):
                          raise RuntimeError("Benchmark receipt lacks its required source hash map")
                      for path, digest in source_map.items():
                          if (not isinstance(path, str) or "\\" in path or ":" in path
                                  or any(part in ("", ".", "..") for part in path.split("/"))
                                  or not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest)):
                              raise RuntimeError("Benchmark receipt has an invalid source hash entry")
                          blob = subprocess.run(["git", "cat-file", "blob", expected.lower() + ":" + path],
                                                cwd=root, capture_output=True, check=True).stdout
                          if (hashlib.sha256(blob).hexdigest() != digest
                                  or hashlib.sha256((root / path).read_bytes()).hexdigest() != digest):
                              raise RuntimeError("Benchmark source bytes differ from the expected Git blob: " + path)
                  except Exception as exc:
                      measurement["receipt_error"] = str(exc)
                  report["measurements"].append(measurement)
                  save()
                  # A nonzero first benchmark never suppresses the second profile.
          except Exception as exc:
              report["errors"].append(str(exc))
          finally:
              try:
                  report["source_after"] = identity()
                  if before is None or report["source_after"] != before:
                      report["errors"].append("Final tracked source identity did not match the initial clean source")
              except Exception as exc:
                  report["errors"].append("Final source check failed: " + str(exc))
              report["passed"] = (not report["errors"] and len(report["measurements"]) == 2
                                  and all(row["exit_code"] == 0 and "receipt_error" not in row
                                          for row in report["measurements"]))
              save()
          if not report["passed"]:
              raise SystemExit("Hosted projection measurement failed; inspect the preserved evidence")
      - name: Preserve step outcomes even when setup fails
        if: ${{ always() }}
        shell: pwsh
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $proof = Join-Path $env:RUNNER_TEMP "atlas-ui-projection-performance"
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          [ordered]@{
            evidence = $env:EVIDENCE_OUTCOME
            checkout = $env:CHECKOUT_OUTCOME
            python = $env:PYTHON_OUTCOME
            measurement = $env:MEASURE_OUTCOME
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $proof "step-outcomes.json") -Encoding utf8
      - name: Upload hosted measurement evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projection-performance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-ui-projection-performance/
          if-no-files-found: error
          retention-days: 14

  installed-transition-runtime:
    name: Installed transition runtime · pinned Windows profile
    needs: package
    runs-on: windows-2025
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Download the exact verified distributions from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist
      - name: Reconcile the test-only provisioning lock to the packaged reference profile
        run: python -I -B tools/build_release1_replay_capsule.py --check-runtime-profile
      - name: Provision the pinned test-only profile and prove source cannot satisfy the smoke
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proofRoot = Join-Path $env:RUNNER_TEMP "atlas-transition-runtime"
          $venv = Join-Path $proofRoot "venv"
          $smoke = Join-Path $proofRoot "smoke_installed_transition_runtime.py"
          New-Item -ItemType Directory -Force -Path $proofRoot | Out-Null
          python -m venv $venv
          $venvPython = Join-Path $venv "Scripts\python.exe"
          Copy-Item -LiteralPath (
            Join-Path $env:GITHUB_WORKSPACE "tools\smoke_installed_transition_runtime.py"
          ) -Destination $smoke
          & $venvPython -m pip install --only-binary=:all: --requirement (
            Join-Path $env:GITHUB_WORKSPACE "tools\requirements-transition-runtime-test.txt"
          )
          if ($LASTEXITCODE -ne 0) {
            throw "failed to provision the pinned transition-runtime test profile"
          }
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $negativeProbe = [System.Diagnostics.ProcessStartInfo]::new()
          $negativeProbe.FileName = $venvPython
          $negativeProbe.UseShellExecute = $false
          $negativeProbe.CreateNoWindow = $true
          $negativeProbe.RedirectStandardOutput = $true
          $negativeProbe.RedirectStandardError = $true
          $negativeProbe.ArgumentList.Add("-I")
          $negativeProbe.ArgumentList.Add("-B")
          $negativeProbe.ArgumentList.Add($smoke)
          $negativeProcess = [System.Diagnostics.Process]::new()
          $negativeProcess.StartInfo = $negativeProbe
          try {
            if (-not $negativeProcess.Start()) {
              throw "failed to start the pre-install smoke"
            }
            $negativeStdoutTask = $negativeProcess.StandardOutput.ReadToEndAsync()
            $negativeStderrTask = $negativeProcess.StandardError.ReadToEndAsync()
            $negativeProcess.WaitForExit()
            $negativeStdout = $negativeStdoutTask.Result
            $negativeStderr = $negativeStderrTask.Result
            $negativeExit = $negativeProcess.ExitCode
          }
          finally {
            $negativeProcess.Dispose()
          }
          $env:PYTHONPATH = ""
          $negativeOutput = @($negativeStdout, $negativeStderr)
          $negativeOutput | ForEach-Object { Write-Host $_ }
          if ($negativeExit -eq 0) {
            throw "checkout source unexpectedly satisfied the installed smoke"
          }
          if (($negativeOutput | Out-String) -notmatch "No module named 'cisco_toolkit'") {
            throw "pre-install smoke failed for a reason other than installed-package absence"
          }
          "TRANSITION_TEST_PYTHON=$venvPython" >> $env:GITHUB_ENV
          "TRANSITION_SMOKE_SCRIPT=$smoke" >> $env:GITHUB_ENV
      - name: Install only the verified wheel into the pinned test profile
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheels = @(
            Get-ChildItem -File -LiteralPath (
              Join-Path $env:GITHUB_WORKSPACE "dist"
            ) -Filter "*.whl"
          )
          if ($wheels.Count -ne 1) {
            throw "expected exactly one verified wheel, found $($wheels.Count)"
          }
          & $env:TRANSITION_TEST_PYTHON -m pip install --only-binary=:all: --constraint (
            Join-Path $env:GITHUB_WORKSPACE "tools\requirements-transition-runtime-test.txt"
          ) $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "verified wheel installation failed"
          }
          & $env:TRANSITION_TEST_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "installed transition-runtime environment has broken requirements"
          }
      - name: Run the dedicated smoke outside the checkout against site-packages
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: python -I -B "$env:GITHUB_WORKSPACE\.github\scripts\run_installed_transition_smoke.py" --python "$env:TRANSITION_TEST_PYTHON" --smoke "$env:TRANSITION_SMOKE_SCRIPT" --source-smoke "$env:GITHUB_WORKSPACE\tools\smoke_installed_transition_runtime.py" --workspace "$env:GITHUB_WORKSPACE"
