name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to an immutable commit. Pull-request code runs only
# on GitHub-hosted, ephemeral runners; repository variables cannot redirect it to a
# persistent machine with local credentials or state.
jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff correctness rules
        run: python -m ruff check .
      - name: Tracked-tree privacy boundary
        run: python .github/scripts/verify_repository_privacy.py

  test:
    name: Tests · py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install complete runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the complete default suite
        run: python -m pytest

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: mypy gated modules
        run: >-
          python -m mypy
          cisco_toolkit/__init__.py cisco_toolkit/cmdio.py cisco_toolkit/eoldb.py
          cisco_toolkit/model.py cisco_toolkit/ouidb.py cisco_toolkit/portdb.py
          cisco_toolkit/protocol_kb.py cisco_toolkit/textutils.py
      - name: mypy full-project report
        continue-on-error: true
        run: python -m mypy cisco_toolkit COLLECT_PARSE_V3_23_0.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Coverage gate
        run: >-
          python -m pytest
          --cov=cisco_toolkit
          --cov-report=term-missing:skip-covered
          --cov-fail-under=85

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - name: Install audited Python environment
        run: python -m pip install -e ".[dev]" "pip-audit>=2.9,<3"
      - name: Audit installed Python dependencies
        run: python -m pip_audit --strict
      - name: Install locked frontend dependencies
        working-directory: webapp/frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: webapp/frontend
        run: npm audit --audit-level=high

  package:
    name: Distribution contract
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Capture the immutable source identity
        id: source
        run: |
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Prove toolchain setup did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Rebuild the bundled AssessHub SPA
        working-directory: webapp/frontend
        run: |
          npm ci
          npm test
          npm run build
      # The separate decision named in the previous revision of this comment has now been TAKEN:
      # `webapp/frontend/dist/` is TRACKED (2026-08-02), pinned `-text` in .gitattributes so the bytes
      # survive round-tripping. That makes this step mean what its name says for the first time — the
      # rebuild is byte-compared against the committed bundle, so a build that does not reproduce it
      # shows up here as a MODIFIED TRACKED FILE and fails.
      #
      # Why it matters: without tracking, `distribution_verify --require-source-binding` exits 3 with
      # "5 shipped archive member(s) are outside the claimed commit" — index.html plus the four
      # content-hashed assets ship in the wheel bound to nothing. Tracking them is what makes the
      # release source-bound.
      #
      # The dist allow-listing is deliberately GONE (tracked paths are not untracked paths, so it is
      # now a no-op that would only mask an unexpected build output). node_modules stays.
      #
      # FIRST RUN IS THE REAL TEST: these bytes were built on Windows and this job rebuilds on
      # ubuntu/node-20. Two consecutive builds were verified byte-identical on the authoring machine,
      # but CROSS-PLATFORM reproduction — including Vite's content-hashed filenames — is unproven
      # until this step runs. If it fails, the honest reading is that the bundle is not reproducible
      # across platforms, and the fix is a pinned/containerised build, NOT re-adding the allowlist.
      - name: Prove the SPA build reproduced the immutable source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
      - name: Install the exact distribution toolchain
        run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - name: Prove tool installation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
      - name: Build exactly one wheel and one source archive
        run: python -m build --sdist --wheel --outdir dist
      - name: Prove the archive build did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Validate archive metadata
        run: python -m twine check dist/*
      - name: Prove metadata validation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Verify runtime completeness, metadata, hashes, and privacy boundary
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --json-out dist/dist-verification.json
      - name: Prove distribution verification did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      # From PR #506 (security: protect client evidence and audit release artifacts). This is the one
      # control that branch had and this job did not: it inspects the archives' MEMBER LIST for client
      # evidence and for required assets, which distribution_verify does not do in those terms. Its
      # sibling steps there (install the wheel, smoke the entry point / KB / explorer template) are
      # deliberately NOT merged -- the steps below already do all of that and more, installing with
      # --force-reinstall and running `assesshub --selftest` plus the scoped registry-authority checks.
      # Placed BEFORE the install and the preservation so a client-evidence leak stops the job at the
      # cheapest point rather than after an artifact has been installed and preserved.
      - name: Audit distribution contents (no client evidence / required assets present)
        run: python tools/audit_wheel.py dist
      - name: Prove the content audit did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Install the wheel non-editably
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove wheel installation did not change the source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Smoke-test installed entry points and authoritative registries
        working-directory: ${{ runner.temp }}
        run: |
          cisco-assess --help
          assesshub --selftest
          # SCOPED authority, not the whole-pack flag. `authoritative` is correctly False for a
          # deliberately mixed pack (portdb carries a curated overlay + multicast semantics
          # alongside the official IANA rows), so asserting it fails a HEALTHY registry. Gate on
          # the two component fields instead, each falling back to `authoritative` when the pack
          # does not publish it (ouidb omits official_source_authoritative entirely).
          # Keep in step with COLLECT_PARSE_V3_23_0.py and webapp/backend/serve.py — `grep -rn
          # registry_health` lists every consumer; there are four.
          python -c "import sys; from cisco_toolkit import ouidb, portdb; ok = lambda h: (lambda w: bool(h.get('integrity_verified', w)) and bool(h.get('official_source_authoritative', w)))(h.get('authoritative')); bad = [(n, h) for n, h in (('oui', ouidb.registry_health()), ('port', portdb.registry_health())) if not ok(h)]; sys.exit('registry pack unusable: %r' % (bad,)) if bad else None"
      - name: Final immutable-source proof before preserving archives
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Reverify the exact archive bytes immediately before preservation
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --expected-json dist/dist-verification.json
      - name: Preserve the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/dist-verification.json
          if-no-files-found: error
          retention-days: 14
