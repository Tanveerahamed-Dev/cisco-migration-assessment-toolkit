name: CI

# Runs the same quality gates the project already enforces by hand on every PR —
# ruff lint + the full pytest suite (which includes the golden snapshot/Excel-schema
# contract) — automatically on each push to main and on every pull request. mypy runs
# as a non-gating report (the repo keeps an intentional report-only typing baseline;
# see mypy.ini). No live network is touched: the suite is fully offline (--no-collect
# / synthetic fixtures), so the deliverables are exercised end to end without SSH.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner fleet toggle: the repo variable CI_RUNNER (Settings → Secrets and variables → Actions →
# Variables) reroutes every job to the self-hosted pool when set to "self-hosted" ($0 metered
# minutes — the pool is the registered runners on the dev box), and falls back to GitHub-hosted
# runners when unset/empty. Job NAMES still derive from the matrix values, so the 10 required
# branch-protection contexts (e.g. "Tests · py3.12 · ubuntu-latest") stay byte-identical under
# either fleet — flipping the variable never wedges the merge gate.

jobs:
  lint:
    name: Ruff lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff check (E4/E7/E9/F — config in ruff.toml)
        run: python -m ruff check .

  test:
    name: Tests · py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ vars.CI_RUNNER || matrix.os }}
    strategy:
      # Don't let one version/OS failing cancel the rest — we want the full grid of results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Floor (README states 3.8+; 3.10 is the realistic modern floor for the deps) through
        # 3.14, the interpreter the project is actively developed on.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Also run one job on Windows (the primary dev OS) so path / line-ending / encoding
        # regressions surface on the platform the goldens were generated on.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # Runtime deps (netmiko/openpyxl + optional python-docx so the runbook path is exercised)
      # plus the dev/test deps (pytest/ruff/mypy).
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite (incl. golden snapshot + Excel-schema contract)
        run: python -m pytest

  typecheck:
    name: mypy
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # GATED: these modules are fully type-clean today and must STAY clean — a regression here fails
      # CI. Grow this list as more modules are brought to zero mypy errors (incremental typing strategy;
      # the heavy dynamic modules — analyze/excel/build — remain in the non-gating report below).
      - name: mypy (gated — type-clean modules must stay clean)
        run: >-
          python -m mypy
          cisco_toolkit/__init__.py cisco_toolkit/cmdio.py cisco_toolkit/eoldb.py
          cisco_toolkit/model.py cisco_toolkit/ouidb.py cisco_toolkit/portdb.py
          cisco_toolkit/protocol_kb.py cisco_toolkit/textutils.py
      # NON-GATING: full-project report (the documented dynamic-typing baseline in mypy.ini). Printed
      # for visibility; continue-on-error keeps the check GREEN. It replaces the previous `|| true`,
      # a bashism that fails to parse under PowerShell 5.1 — the default step shell on the self-hosted
      # Windows fleet. Tighten by promoting modules to the gated step.
      - name: mypy (full report — non-gating)
        continue-on-error: true
        run: python -m mypy cisco_toolkit COLLECT_PARSE_V3_23_0.py

  coverage:
    name: Coverage
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # GATED at 85% (measured 91% with the wider surface; headroom covers the ubuntu/Windows
      # platform-branch delta). The surface now includes the ENTRY MODULE (Plan A / Move-0.2,
      # measured 73%) via [tool.coverage.run] source_pkgs in pyproject.toml — pytest-cov's
      # --cov=<pkg> overrides `source` but leaves source_pkgs intact (do NOT use the
      # --cov=<file>.py path form: it crashes pytest-cov on this stack; pinned by
      # tests/test_ci_gates.py). The module is exercised in-process by
      # tests/test_pipeline_inprocess.py driving main(). Lift the floor as coverage rises.
      - name: pytest with coverage (fail under 85%; entry module via source_pkgs)
        run: python -m pytest --cov=cisco_toolkit --cov-report=term-missing:skip-covered --cov-fail-under=85

  package:
    name: Package build + install
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      # Build the exact artifact that would be published, inspect its member list for client evidence
      # and unexpected repository files, then install that wheel non-editably. `pip install .` alone
      # proves installability but does not make an accidental package-discovery expansion visible.
      - name: Build the wheel
        run: python -m build --wheel --outdir dist
      - name: Audit wheel contents (no client evidence / required runtime assets present)
        run: python tools/audit_wheel.py dist/*.whl
      - name: Install the audited wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test the console entry point
        run: cisco-assess --help
      - name: Smoke-test that the gzipped KB data shipped in the wheel
        run: python -c "from cisco_toolkit import portdb; assert portdb.service_for_port(443) is not None; print('packaged KB data loads from the installed wheel')"
      - name: Smoke-test that the explorer template shipped in the wheel
        run: python -c "import cisco_toolkit, os; p=os.path.join(os.path.dirname(cisco_toolkit.__file__),'blast_radius_explorer.html'); assert os.path.isfile(p), p; print('explorer template shipped in the wheel:', os.path.getsize(p), 'bytes')"
