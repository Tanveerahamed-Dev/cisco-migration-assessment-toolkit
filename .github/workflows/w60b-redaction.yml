name: W60b redaction differential

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cisco_toolkit/html.py"
      - "cisco_toolkit/parse.py"
      - "webapp/backend/redaction_verify.py"
      - "tests/test_redaction_grammar_corpus.py"
      - "tests/test_w60b_redaction.py"
      - "tests/test_w60c_redaction.py"
      - "tests/fixtures/*redaction*corpus.json"
      - ".github/workflows/w60b-redaction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w60b-redaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Diagnostic and regression evidence only. This does not publish engine outputs,
# update baselines, grant release authority or replace any protected CI context.
jobs:
  redaction:
    name: W60b exact archival redaction and output custody
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install canonical locked runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Legacy and W60c corpus suites, real scrub, verifier and exact archive parity
        env:
          W60B_ARCHIVE_DIFFERENTIAL: "1"
        run: >-
          python -m pytest -o addopts="" -v -s
          tests/test_redaction_grammar_corpus.py tests/test_w60b_redaction.py tests/test_w60c_redaction.py
          tests/test_release_supply_chain.py::test_every_action_is_pinned_to_an_immutable_commit
          tests/test_release_supply_chain.py::test_hosted_runner_pins_preserve_jobs_matrix_and_protected_contexts
          tests/test_release_supply_chain.py::test_hosted_runner_contract_rejects_selector_name_and_job_body_drift
          tests/test_release_supply_chain.py::test_hosted_runner_contract_rejects_census_drift
          tests/test_release_supply_chain.py::test_hosted_runner_contract_rejects_matrix_drift
