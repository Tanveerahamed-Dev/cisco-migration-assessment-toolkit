name: G14 paired compute diagnostic

# Temporary round-6 investigation. Original protected workflows and gates are
# unchanged; this runs both historical subjects, not an acceptance substitute.
on:
  pull_request:
    paths:
      - .github/workflows/g14-compute-diagnostic.yml
      - .github/scripts/carriage_compute_observer.py
      - .github/scripts/run_carriage_compute_pair.py

permissions:
  contents: read

concurrency:
  group: g14-compute-pair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pair:
    name: Same-runtime old and round-5 compute observations
    if: github.event.pull_request.number == 652
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      G14_PAIR_OUTPUT: ${{ runner.temp }}/g14-compute-pair
      ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
      ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Resolve one shared runtime for both subjects
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "graphifyy==0.9.51" "wheel==0.48.0"
      - name: Observe original focused and complete selections at 69bf8980
        run: python .github/scripts/run_carriage_compute_pair.py baseline
      - name: Preserve the completed baseline before the second subject
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g14-compute-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g14-compute-pair
          if-no-files-found: error
          retention-days: 30
      - name: Observe original focused and complete selections at 3abe9d0f
        if: ${{ !cancelled() }}
        run: python .github/scripts/run_carriage_compute_pair.py round5
      - name: Preserve all observations including failed gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g14-compute-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g14-compute-pair
          if-no-files-found: error
          retention-days: 30
