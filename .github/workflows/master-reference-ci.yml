name: Master reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-reference-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact-source compiler, reference, and release contracts
    runs-on: ubuntu-24.04
    # A job-level block replaces the workflow-level one, so contents: read is
    # restated. actions: read lets the capacity guard read the newest main
    # capacity record (W64-0); it grants no write.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: master-reference/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked dependency graph
        working-directory: master-reference
        run: npm ci --ignore-scripts
      - name: Install the pinned release and verification toolchain
        run: python -m pip install --requirement master-reference/requirements-release.txt
      - name: Verify Python compiler, governance, PDF, and release contracts
        run: python -m pytest master-reference/tests -q
      - name: Lint Python compiler and release code
        run: >-
          python -m ruff check
          master-reference/atlas_privacy.py
          master-reference/compiler
          master-reference/governance
          master-reference/release
          master-reference/cli
          master-reference/tests
      # GNU time (/usr/bin/time, apt package `time` on ubuntu-24.04) reports the
      # step's peak RSS as "Maximum resident set size (kbytes)" on success and
      # failure alike. The compiler holds every compiler record in memory;
      # `cli build` validates every record but retains only the groups the
      # release builders read and streams the rest (W64a). The `cli build` peak
      # is the measured basis for the release intake's chunk-census ceiling
      # (W63, W64a; release/compiler_bundle.py). Each
      # report is kept under $RUNNER_TEMP/atlas-capacity for the capacity guard
      # (W64-0) and printed to the log; the step still exits with the command's
      # own status.
      - name: Compile the exact tracked Git tree
        working-directory: master-reference
        run: |
          free -b
          mkdir -p "$RUNNER_TEMP/atlas-capacity"
          status=0
          /usr/bin/time -v -o "$RUNNER_TEMP/atlas-capacity/compiler.time" python -m compiler --repo-root .. --output "$RUNNER_TEMP/atlas-compiler" || status=$?
          if [ -f "$RUNNER_TEMP/atlas-capacity/compiler.time" ]; then cat "$RUNNER_TEMP/atlas-capacity/compiler.time" >&2; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          find "$RUNNER_TEMP/atlas-compiler/chunks" -type f -name '*.json' -printf '%s\n' \
            | awk '{ n += 1; s += $1 } END { printf "compiler chunk census: chunks=%d bytes=%.0f\n", n, s }'
      - name: Validate every compiler envelope against tracked JSON Schemas
        working-directory: master-reference
        run: python -m compiler.schema_validation --input "$RUNNER_TEMP/atlas-compiler"
      - name: Build the exact-source lazy browser projection
        working-directory: master-reference
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-capacity"
          status=0
          /usr/bin/time -v -o "$RUNNER_TEMP/atlas-capacity/projection.time" node build/projection/build.mjs --input "$RUNNER_TEMP/atlas-compiler" --output public/atlas-projection || status=$?
          if [ -f "$RUNNER_TEMP/atlas-capacity/projection.time" ]; then cat "$RUNNER_TEMP/atlas-capacity/projection.time" >&2; fi
          exit "$status"
      - name: Type-check, build, and verify rendered and content contracts
        working-directory: master-reference
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-capacity"
          status=0
          /usr/bin/time -v -o "$RUNNER_TEMP/atlas-capacity/npm-test.time" npm test || status=$?
          if [ -f "$RUNNER_TEMP/atlas-capacity/npm-test.time" ]; then cat "$RUNNER_TEMP/atlas-capacity/npm-test.time" >&2; fi
          exit "$status"
      - name: Lint correctness, accessibility, and framework contracts
        working-directory: master-reference
        run: npm run lint
      - name: Audit the complete build dependency graph
        working-directory: master-reference
        run: npm audit --audit-level=high
      # stdout carries the success JSON with the release intake's chunk census;
      # stderr carries a refusal's scanned_bytes and limit. Both are kept for
      # the capacity guard and printed to the log after the command ends.
      - name: Build the deterministic source-bound artifact family and PDF
        working-directory: master-reference
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-capacity"
          status=0
          /usr/bin/time -v -o "$RUNNER_TEMP/atlas-capacity/cli-build.time" python -m cli build --repo-root .. --compiler-output "$RUNNER_TEMP/atlas-compiler" --output "$RUNNER_TEMP/atlas-release" > "$RUNNER_TEMP/atlas-capacity/cli-build.stdout" 2> "$RUNNER_TEMP/atlas-capacity/cli-build.stderr" || status=$?
          cat "$RUNNER_TEMP/atlas-capacity/cli-build.stdout"
          cat "$RUNNER_TEMP/atlas-capacity/cli-build.stderr" >&2
          if [ -f "$RUNNER_TEMP/atlas-capacity/cli-build.time" ]; then cat "$RUNNER_TEMP/atlas-capacity/cli-build.time" >&2; fi
          exit "$status"
      - name: Reconcile every emitted artifact receipt
        working-directory: master-reference
        run: python -m cli verify-family --manifest "$RUNNER_TEMP/atlas-release/release-manifest.json"
      # W64-0 trend input, advisory only: the newest readable capacity record
      # from a main push run. A fork, the first run or an expired artifact
      # leaves no baseline, and this step never fails on missing history.
      - name: Fetch the latest main capacity record (advisory)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline="$RUNNER_TEMP/atlas-capacity/baseline"
          rm -rf "$baseline"
          mkdir -p "$baseline"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master-reference-ci.yml --branch main --event push --status completed --limit 20 --json databaseId --jq '.[].databaseId' 2> /dev/null)" || runs=""
          for run in $runs; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name master-reference-capacity --dir "$baseline" > /dev/null 2>&1 && [ -f "$baseline/capacity.json" ]; then
              echo "capacity baseline: main run $run"
              exit 0
            fi
            rm -rf "$baseline"
            mkdir -p "$baseline"
          done
          echo "capacity baseline: none (no readable main capacity record)"
      # W64-0: measure every capacity wall against the limit its code owner
      # declares; warn at 85 %, fail at 95 % (docs/w64-capacity-guard-2026-10-10.md).
      # It runs after a failed step too, so a failing step's numbers are still
      # reported, and an unmeasured wall fails closed. It is skipped only when
      # the run is cancelled.
      - name: Measure every capacity wall (warn at 85 %, fail at 95 %)
        if: ${{ !cancelled() }}
        working-directory: master-reference
        run: >-
          python -m cli.capacity
          --compiler-output "$RUNNER_TEMP/atlas-compiler"
          --cli-build-stdout "$RUNNER_TEMP/atlas-capacity/cli-build.stdout"
          --cli-build-stderr "$RUNNER_TEMP/atlas-capacity/cli-build.stderr"
          --dist dist
          --projection-dir public/atlas-projection
          --rss "compiler=$RUNNER_TEMP/atlas-capacity/compiler.time"
          --rss "projection=$RUNNER_TEMP/atlas-capacity/projection.time"
          --rss "npm_test=$RUNNER_TEMP/atlas-capacity/npm-test.time"
          --rss "cli_build=$RUNNER_TEMP/atlas-capacity/cli-build.time"
          --meminfo /proc/meminfo
          --disk "runner_temp=$RUNNER_TEMP"
          --disk "workspace=$GITHUB_WORKSPACE"
          --baseline "$RUNNER_TEMP/atlas-capacity/baseline/capacity.json"
          --output "$RUNNER_TEMP/atlas-capacity/capacity.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the capacity record for the main trend
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: master-reference-capacity
          path: ${{ runner.temp }}/atlas-capacity/capacity.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      # W64a one-time A/B proof for the round-2 head, removed again by the
      # follow-up that re-derives the ceiling from this run's measurement
      # (docs/w64a-streaming-intake-2026-10-10.md). It extracts this head's
      # master-reference/ with git archive, overlays the pre-W64a version
      # (2ac65468) of every production file W64a changes, rebuilds the family
      # from the same compiler output, and requires every member to be
      # byte-identical to the streamed build's. The checkout is not touched.
      - name: Prove the streamed family equals the pre-W64a build (W64a, temporary)
        run: |
          legacy="$RUNNER_TEMP/w64a-pre-streaming"
          rm -rf "$legacy" "$RUNNER_TEMP/atlas-release-pre-w64a"
          mkdir -p "$legacy"
          git archive --format=tar HEAD master-reference | tar -x -C "$legacy"
          for file in master-reference/atlas_privacy.py master-reference/release/compiler_bundle.py master-reference/release/model.py master-reference/release/pipeline.py master-reference/release/pdf_report.py; do
            git show "2ac654684767effb894282817c6cf85a54931a58:$file" > "$legacy/$file"
          done
          status=0
          (cd "$legacy/master-reference" && /usr/bin/time -v -o "$RUNNER_TEMP/atlas-capacity/cli-build-pre-w64a.time" python -m cli build --repo-root "$GITHUB_WORKSPACE" --compiler-output "$RUNNER_TEMP/atlas-compiler" --output "$RUNNER_TEMP/atlas-release-pre-w64a") || status=$?
          if [ -f "$RUNNER_TEMP/atlas-capacity/cli-build-pre-w64a.time" ]; then cat "$RUNNER_TEMP/atlas-capacity/cli-build-pre-w64a.time" >&2; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "peak RSS, streamed (W64a) build:"
          grep "Maximum resident set size" "$RUNNER_TEMP/atlas-capacity/cli-build.time"
          echo "peak RSS, pre-W64a build of the same compiler output:"
          grep "Maximum resident set size" "$RUNNER_TEMP/atlas-capacity/cli-build-pre-w64a.time"
          sha256sum "$RUNNER_TEMP/atlas-release/release-manifest.json" "$RUNNER_TEMP/atlas-release-pre-w64a/release-manifest.json"
          diff -r "$RUNNER_TEMP/atlas-release" "$RUNNER_TEMP/atlas-release-pre-w64a"
          echo "W64a A/B: every release family member is byte-identical to the pre-W64a build"
