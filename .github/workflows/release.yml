name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify tag and create immutable release assets
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Capture the immutable tagged-source identity
        id: source
        run: |
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Prove toolchain setup did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Verify annotated tag, project version, commit, and main ancestry
        run: >-
          python .github/scripts/verify_release.py
          --tag "${GITHUB_REF_NAME}"
          --commit HEAD
          --base origin/main
      - name: Prove release validation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Verify the tagged tracked-tree privacy boundary
        run: python .github/scripts/verify_repository_privacy.py
      # THE GATE THAT WAS MISSING — see the identical note in release-selfhosted.yml. Every other
      # step verifies PROVENANCE; none verified that the tagged code passes its own tests, so
      # RELEASING.md's "confirm all required CI checks are green" precondition was an unenforced
      # markdown instruction. It failed the first time it was stressed (v3.32.0 released from a
      # commit whose suite was RED). Kept in lockstep with the self-hosted path.
      - name: Install the test toolchain against the tagged source
        run: python -m pip install -e ".[dev]"
      - name: Run the complete suite against the tagged source
        run: python -m pytest -q -p no:cacheprovider
      # See the identical note in release-selfhosted.yml: the suite mutates the checkout
      # (pytest cache, egg-info, an engine log written to CWD) and the immutability proofs must
      # stay a real instrument, so the checkout is restored rather than the allow-list widened.
      - name: Restore the tagged checkout after the suite
        run: |
          git clean -fdx
          git checkout -- .
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "suite left the tagged checkout dirty" >&2
            exit 1
          fi
      - name: Prove privacy and suite validation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Detect an idempotent re-run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the already-published assets on a re-run
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${GITHUB_REF_NAME}"
          --pattern "*.whl"
          --pattern "*.tar.gz"
          --pattern "dist-verification.json"
          --dir dist
      - name: Prove release lookup and download did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix dist
      - name: Rebuild the bundled AssessHub SPA
        if: steps.existing.outputs.exists == 'false'
        working-directory: webapp/frontend
        run: |
          npm run verify:node
          npm ci
          npm test
          npm run build
      # See the matching note in ci.yml. `webapp/frontend/dist/` is untracked AND not ignored, and
      # `_untracked_paths` omits --exclude-standard, so `npm run build` produced an unapproved
      # untracked path and this step failed deterministically — blocking the release job. Renamed to
      # what the script actually verifies: with dist/ untracked there are no tracked bytes to compare
      # a build against. Note the existing `--allow-untracked-prefix dist` does NOT cover it: the
      # match is a str.startswith on the repo-relative path, and `webapp/frontend/dist/` does not
      # start with `dist/`.
      # `webapp/frontend/dist/` is TRACKED as of 2026-08-02 (pinned `-text`), so its allow-listing is
      # gone: the rebuild is now byte-compared against the tagged bundle, which is what lets
      # `distribution_verify --require-source-binding` bind the shipped SPA members to the tag instead
      # of reporting them as outside the claimed commit. The root `dist/` (wheel/sdist output) and
      # node_modules stay allow-listed — both are genuinely untracked build products.
      - name: Prove the SPA build reproduced the immutable tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix dist
      - name: Install the exact distribution toolchain
        run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - name: Prove tool installation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix dist
      - name: Build the release archives once
        if: steps.existing.outputs.exists == 'false'
        run: python -m build --sdist --wheel --outdir dist
      - name: Prove archive creation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Verify archive metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Audit release archive contents (no client evidence / required assets present)
        run: python tools/audit_wheel.py dist
      - name: Prove metadata validation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Create the trusted distribution proof
        if: steps.existing.outputs.exists == 'false'
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --require-source-binding
          --json-out dist/dist-verification.json
      - name: Recompute and compare the trusted distribution proof on a re-run
        if: steps.existing.outputs.exists == 'true'
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --require-source-binding
          --expected-json dist/dist-verification.json
          --json-out "${RUNNER_TEMP}/recomputed-dist-verification.json"
      - name: Prove distribution verification did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Install and smoke-test the exact wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove wheel installation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Verify the installed runtime outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          cisco-assess --help
          assesshub --selftest
          # EoL has no wheel-context authority exception: its compact retained Cisco fixture ships
          # in the wheel and must verify. The cannot-check-here disclosure below is only for the
          # much larger IEEE/IANA source corpus used to build the OUI/port packs.
          # Routed through registry_integrity.pack_is_usable — the ONE owner of this question
          # (same fix ci.yml received; this copy survived because this workflow's smoke gate had
          # never executed). The old inline conjunction required official_source_authoritative,
          # which is STRUCTURALLY False for an installed wheel: the retained official-source
          # corpus is repo/sdist evidence, deliberately not shipped in the wheel — the exact
          # cannot-check-here case pack_is_usable exists to accept and disclose. Proven on the
          # fleet (run 30819857934): `assesshub --selftest` PASSED via the owner predicate while
          # this very next line exited 1 on the same facts.
          python -c "import sys; from cisco_toolkit import eoldb, ouidb, portdb, registry_integrity as R; pairs = (('oui', ouidb.registry_health()), ('port', portdb.registry_health()), ('eol', eoldb.registry_health())); bad = [(n, h) for n, h in pairs if not R.pack_is_usable(h)]; [print(f'{n}: usable on bytes + build provenance; retained official sources not present in this install form (repo/sdist only)') for n, h in pairs if h.get('official_sources_available') is False and not bad]; sys.exit('registry pack unusable: %r' % (bad,)) if bad else None"
      - name: Final immutable-tagged-source proof before release
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix webapp/frontend/node_modules
          --allow-untracked-prefix build
          --allow-untracked-prefix cisco_migration_assessment_toolkit.egg-info
          --allow-untracked-prefix dist
      - name: Reverify exact bytes and create the GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m cisco_toolkit.distribution_verify dist \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --require-source-binding \
            --expected-json dist/dist-verification.json
          wheel="$(python -c 'import json; print(json.load(open("dist/dist-verification.json", encoding="utf-8"))["wheel"])')"
          sdist="$(python -c 'import json; print(json.load(open("dist/dist-verification.json", encoding="utf-8"))["sdist"])')"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${wheel}" \
            "dist/${sdist}" \
            dist/dist-verification.json \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
