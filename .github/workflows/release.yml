name: Release

# Cut a GitHub Release whenever a version tag (vX.Y.Z) is pushed. Notes are auto-generated from the
# merged PRs / commits since the previous tag, so a release is one `git push` of a tag away — no manual
# release authoring. Idempotent: if a Release for the tag already exists (e.g. it was bootstrapped by
# hand), the job no-ops instead of failing. See RELEASING.md for the full process.

on:
  push:
    tags:
      - "v*"

# Creating a Release requires write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so auto-generated notes can diff against the prior tag
      - name: Create the Release (idempotent; auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
