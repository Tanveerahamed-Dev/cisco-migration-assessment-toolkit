name: RC8 order and added-time diagnostic
on:
  push:
    branches: [codex/rc8-order-diagnostic]
  workflow_dispatch:
    inputs:
      prefixes_json:
        description: 'JSON array of whole-file cut points; [""] means the full prefix'
        type: string
        required: true
        default: '[""]'
      measure_changed_cost:
        description: "Also repeat the retained Windows changed-module cost probe"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  builtin:
    # Supervisor's seven-case direct experiment owns the next push. Existing
    # prefix runs remain pinned to their original control commit and continue.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cut_before: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.prefixes_json || '["", "tests/test_memory_guard.py", "tests/test_rest_collect.py"]') }}
    steps:
      - name: Start bounded diagnostic clock
        shell: bash
        run: echo "ATLAS_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
        working-directory: subject
      # Match the production Python-3.12 leg's preceding fresh-process commands.
      # Their bytecode/filesystem state is part of the full-suite precondition.
      - name: Original preflight commands before the full suite
        working-directory: subject
        run: |
          python -m pytest tests/test_scope_compile_handoff.py
          python -m pytest tests/test_client_artifact_census.py
          python -m pytest tests/test_knowledge_export.py tests/test_knowledge_export_workflow.py
          python -m pytest tests/test_transition_runtime_discovery.py -k debug_helper_receive
          python -u -m pytest -vv tests/test_bound_snapshot_source.py
      - run: python -m pip install graphifyy==0.9.51
        working-directory: subject
      - run: python -I -B tools/graphify_guarded.py --probe
        working-directory: subject
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: subject/atlas-scope
      - name: Original G14 focused process before the full suite
        working-directory: subject
        env:
          ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
          ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
        run: >-
          python -m pytest tests/test_vlan_carriage.py tests/test_ui_projection_vlan_carriage.py
          tests/test_vlan_carriage_budget.py tests/test_operator_evidence_contract.py
          tests/test_bound_snapshot_source.py webapp/tests/test_ui_projection_api.py
          webapp/tests/test_carriage_ingestion.py webapp/tests/test_snapshot_raw.py
          webapp/tests/test_carriage_lifecycle.py
          webapp/tests/test_atlas_unplug_safety.py::test_serve_main_legacy_preparation_limit_refuses_clearly_and_retries_original_snapshot
      - name: Original pytest with built-in whole-file collection exclusions only
        env:
          ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
          ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
          CUT_BEFORE: ${{ matrix.cut_before }}
        run: >-
          python control/.github/diagnostics/rc8_order_probe.py --subject subject
          --output "$RUNNER_TEMP/builtin" --source 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          --baseline c2de3bf8005912c29c052dcedaa71b0acc3ca9f0 --mode builtin --cut-before "$CUT_BEFORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rc8-builtin-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/builtin
          if-no-files-found: error
  added-time:
    # Both direct-cost pairs are retained already; another cost run is opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.measure_changed_cost
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [8c4b87d8bc149a30fcd05f5efcd123856a2778e6, c2de3bf8005912c29c052dcedaa71b0acc3ca9f0]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Start bounded diagnostic clock
        shell: bash
        run: echo "ATLAS_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - run: python -m pip install --upgrade pip==26.2.1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python -m pip install -r requirements-dev.txt
        working-directory: subject
      - name: Measure changed/new test modules with full durations
        shell: bash
        run: >-
          python control/.github/diagnostics/rc8_order_probe.py --subject subject
          --output "$RUNNER_TEMP/cost" --source ${{ matrix.source }}
          --baseline c2de3bf8005912c29c052dcedaa71b0acc3ca9f0 --mode cost
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rc8-added-time-${{ matrix.source }}-${{ github.sha }}
          path: ${{ runner.temp }}/cost
          if-no-files-found: error
