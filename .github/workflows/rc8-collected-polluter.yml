name: RC8 default collection module pollution diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module-then-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module:
          - control
          - tests/test_portable_desktop_proof.py
          - tests/test_portable_maintenance.py
          - tests/test_portable_maintenance_handoff.py
          - tests/test_portable_managed_pe.py
          - tests/test_portable_source_view.py
          - tests/test_readme_field.py
    env:
      ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
      ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
    steps:
      - name: Start unchanged bounded diagnostic clock
        shell: bash
        run: echo "ATLAS_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install graphifyy==0.9.51
        working-directory: subject
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: subject/atlas-scope
      - name: Default collection then built-in execution deselection in one pytest process
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: >-
          python control/.github/diagnostics/rc8_order_probe.py --subject subject
          --output "$RUNNER_TEMP/collected" --source 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          --baseline c2de3bf8005912c29c052dcedaa71b0acc3ca9f0
          --mode collected --test-module "$TEST_MODULE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rc8-collected-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/collected
          if-no-files-found: error
