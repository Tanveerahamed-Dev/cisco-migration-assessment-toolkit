name: RC8 external native sampling diagnostic
on:
  push:
    branches: [codex/rc8-order-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [none, native]
    env:
      ATLAS_SCOPE_REQUIRE_REAL_TOOLCHAIN: "1"
      ATLAS_SCOPE_REQUIRE_MARKUP_ORACLE: "0"
    steps:
      - name: Start unchanged bounded diagnostic clock
        shell: bash
        run: echo "ATLAS_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 6900 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install graphifyy==0.9.51
        working-directory: subject
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: subject/atlas-scope
      - name: Pin the official sampler outside the child environment in BOTH jobs
        shell: bash
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/pyspy.whl" https://github.com/benfred/py-spy/releases/download/v0.4.1/py_spy-0.4.1-py2.py3-none-manylinux_2_5_x86_64.manylinux1_x86_64.whl
          echo "6a80ec05eb8a6883863a367c6a4d4f2d57de68466f7956b6367d4edd5c61bb29  $RUNNER_TEMP/pyspy.whl" | sha256sum --check --strict
          python -I -B - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'rc8-profiler'
          output.mkdir()
          wheel = root / 'pyspy.whl'
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert digest == '6a80ec05eb8a6883863a367c6a4d4f2d57de68466f7956b6367d4edd5c61bb29'
          with zipfile.ZipFile(wheel) as archive:
              members = [row for row in archive.infolist() if pathlib.PurePosixPath(row.filename).name == 'py-spy' and not row.is_dir()]
              assert len(members) == 1 and members[0].file_size < 20_000_000
              binary = output / 'py-spy'
              binary.write_bytes(archive.read(members[0]))
          binary.chmod(0o755)
          (output / 'receipt.json').write_text(json.dumps({
              'release': 'v0.4.1', 'upstream_source': '4fff22535911e729627b41df48bc26aa13fce67a',
              'asset_id': 278203917, 'wheel_sha256': digest, 'binary_member': members[0].filename,
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
          }, indent=2), encoding='utf-8')
          PY
      - name: Original no-exclusion collection control, optionally sampled externally
        env:
          PROFILE_MODE: ${{ matrix.profile }}
        run: >-
          python control/.github/diagnostics/rc8_order_probe.py --subject subject
          --output "$RUNNER_TEMP/native-profile" --source 8c4b87d8bc149a30fcd05f5efcd123856a2778e6
          --baseline c2de3bf8005912c29c052dcedaa71b0acc3ca9f0
          --mode collection-cut --collection-case pr-full --profile "$PROFILE_MODE"
          --profiler-binary "$RUNNER_TEMP/rc8-profiler/py-spy"
          --profiler-receipt "$RUNNER_TEMP/rc8-profiler/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rc8-native-${{ matrix.profile }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-profile
          if-no-files-found: error