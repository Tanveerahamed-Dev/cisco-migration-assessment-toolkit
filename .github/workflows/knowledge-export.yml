name: ATLAS knowledge export

# Manual review data only. PRs and pushes run the ordinary tests, never generation.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact merged RC7 source (this reviewed workflow refuses any other revision)
        required: true
        type: string
        default: "3401627f6fd69bb838a2c921d7f95c77b2373623"

permissions:
  contents: read

concurrency:
  group: knowledge-export-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  export:
    name: Export exact RC7 knowledge for review (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      TZ: UTC
    steps:
      - name: Require the reviewed RC7 source selection
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = '3401627f6fd69bb838a2c921d7f95c77b2373623'
      - name: Check out the workflow controller separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Check out the exact knowledge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "3401627f6fd69bb838a2c921d7f95c77b2373623"
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Install the already reviewed AST producer
        working-directory: controller
        run: python -m pip install -r requirements-dev.txt "graphifyy==0.9.51"
      - name: Refute export admission and workflow boundary defects
        working-directory: controller
        run: python -m pytest -p no:cacheprovider tests/test_knowledge_export.py tests/test_knowledge_export_workflow.py
      - name: Generate and verify the source-bound knowledge handoff
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          python -I -B controller/.github/scripts/knowledge_export.py
          --source-root "$GITHUB_WORKSPACE/source"
          --expected-source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/knowledge-output"
          --diagnostics "$RUNNER_TEMP/knowledge-diagnostics"
      - name: Preserve only the verified review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-knowledge-3401627f6fd69bb838a2c921d7f95c77b2373623-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve refusal diagnostics without an importable vault
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-knowledge-BLOCKED-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
