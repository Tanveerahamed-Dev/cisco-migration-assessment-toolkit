name: Publish verified release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing verified GitHub Release tag (for example v3.31.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Promote exact GitHub Release assets
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    environment:
      name: pypi
      url: https://pypi.org/p/cisco-migration-assessment-toolkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Capture the immutable tagged-source identity
        id: source
        run: |
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Prove toolchain setup did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Verify annotated tag, project version, commit, and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python .github/scripts/verify_release.py
          --tag "${RELEASE_TAG}"
          --commit HEAD
          --base origin/main
      - name: Prove release validation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Verify the tagged tracked-tree privacy boundary
        run: python .github/scripts/verify_repository_privacy.py
      - name: Prove privacy validation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
      - name: Download the exact wheel and source archive from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist "${RUNNER_TEMP}/release-proof"
          gh release download "${RELEASE_TAG}" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist
          gh release download "${RELEASE_TAG}" \
            --pattern "dist-verification.json" \
            --dir "${RUNNER_TEMP}/release-proof"
      - name: Prove asset download did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix dist
      - name: Install the exact archive validator
        run: python -m pip install "twine==6.2.0"
      - name: Prove tool installation did not change the tagged source
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix dist
      - name: Validate downloaded release archives
        run: |
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m cisco_toolkit.distribution_verify dist \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --expected-json "${RUNNER_TEMP}/release-proof/dist-verification.json"
      - name: Final immutable-tagged-source proof before publication
        run: >-
          python .github/scripts/verify_checkout_immutable.py
          --expected-commit "${{ steps.source.outputs.commit }}"
          --expected-tree "${{ steps.source.outputs.tree }}"
          --allow-untracked-prefix dist
      - name: Reverify the exact archive bytes immediately before publication
        run: >-
          python -m cisco_toolkit.distribution_verify dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --source-tree "${{ steps.source.outputs.tree }}"
          --expected-json "${RUNNER_TEMP}/release-proof/dist-verification.json"
      - name: Publish exact assets with trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          attestations: true
