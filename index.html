<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Atlas Scope</title>
    <meta
      name="description"
      content="Three-dimensional network investigation over collected assessment evidence: priority to device to finding to configuration, and path question to blocking hop."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0e14'/%3E%3Cpath d='M16 5v22M5 16h22M9 9l14 14M23 9L9 23' stroke='%234fd1c5' stroke-width='1.5' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fd1c5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- The boot line. React's createRoot replaces everything inside #root on its first commit, so
         this exists for exactly as long as the application bundle is being fetched and evaluated —
         measured (review/audit-e5-coldload.mjs, release build) as a 369 ms animation frame at
         ~340 ms with an empty page and nothing saying work was happening. `aria-busy` sits on this
         element, not on #root, because React does not own #root's attributes and would leave a
         busy flag there forever. Plain text, no script, no animation: it must render before any
         of those have loaded.
         BEING IN THE DOM IS NOT BEING ON SCREEN (review, 2026-09-22): first-contentful-paint used
         to land after React had already replaced this line, because the entry chunk evaluated the
         whole application before the browser's first rendering step. src/main.tsx now waits for a
         rendering opportunity before importing the application, and `elementtiming` lets the E5
         instruments credit this line only from the moment the browser reports it PAINTED.
         Its colours are the theme tokens (tokens.css is linked in the head by the entry), falling
         back to the system canvas only if that stylesheet is missing. -->
    <div id="root"><p class="boot" role="status" aria-busy="true" elementtiming="atlas-boot" style="margin:0;padding:1rem;font:14px/1.4 system-ui,sans-serif;color:var(--text,CanvasText);background:var(--bg,Canvas)">Loading Atlas Scope — reading the collected snapshot.</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
