[pytest]
# webapp/tests joined the default gate in Plan A / Move-0.2 (it had sat outside the suite
# + Stop hook); engine-only environments skip it cleanly via webapp/tests/conftest.py.
testpaths = tests webapp/tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
# CI runs the default suite in two passes that together are the whole suite: everything else in
# pytest-xdist workers, then the `unshared` tests in one serial process
# (.github/workflows/ci.yml; tests/test_ci_gates.py :: test_every_parallel_suite_pass_has_its_serial_unshared_complement).
markers =
    unshared: needs the runner to itself (a millisecond budget, or a real Windows capture under the product's own git and debugger deadlines), so it never runs in pytest-xdist workers
