# Ruff config for COLLECT_PARSE_V3_23_0.py - a deliberately compact single-file
# script. Keep the correctness checks (F + E4/E7/E9) but ignore the one-liner /
# semicolon / ambiguous-name STYLE rules the code uses on purpose, so `ruff check`
# surfaces real issues instead of ~296 stylistic nits. Report-only for now; see
# the V3.23.8 baseline in CHAT_SUMMARY.md. Run: python -m ruff check .
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E701",  # multiple statements on one line (colon)    - intentional compact style
    "E702",  # multiple statements on one line (semicolon) - intentional
    "E741",  # ambiguous variable name (l / I / O)         - pre-existing, low value
]
